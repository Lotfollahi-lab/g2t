[project]
name = "scgg"
version = "0.1.0"
description = "Spatial Graph Generation — LUNA codebase under the hood, scGG entry points"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scanpy>=1.9",
    "anndata>=0.9",
    "faiss-cpu>=1.7",
    "wandb>=0.15",
    # LUNA's runtime dependencies — vendored verbatim under scgg/src/{models,
    # utils, metrics, datasets, configs}, called via Hydra. Keep these pinned
    # loosely (>=) so we can pull patches from upstream LUNA without
    # re-specifying versions here.
    "pytorch-lightning>=2.0",
    "torch-geometric>=2.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "linear-attention-transformer>=0.19",
    "pandas>=2.0",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.4",
]

# Source layout is src/. Map the empty package root to src/ so BOTH
# `[tool.setuptools.packages.find]` AND `py-modules` resolve relative to
# src/. Without this `package-dir`, the top-level py-modules
# (`main.py`, `diffusion_model.py`) silently fail to install on editable
# pip and `import main` / `import diffusion_model` raise
# ModuleNotFoundError at runtime.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "diffusion_model"]

# Packages found under src/. We register both:
#   - `scgg.*`             — our entry-point package (scripts/eval/data live here)
#   - LUNA's top-level pkgs — vendored verbatim, imported as `models`,
#                             `utils`, `metrics`, `datasets`, `configs`
#                             (LUNA's own import style, kept unchanged
#                             so we track upstream).
[tool.setuptools.packages.find]
where = ["src"]
include = [
    "scgg", "scgg.*",
    "models", "models.*",
    "utils", "utils.*",
    "metrics", "metrics.*",
    "datasets", "datasets.*",
    "configs", "configs.*",
]

[tool.setuptools.package-data]
# LUNA's Hydra configs are YAML files inside the `configs` package; they
# must be included in the wheel so Hydra can discover them at runtime.
"configs" = ["**/*.yaml"]

[build-system]
# setuptools >= 64 is the first version with PEP 660 (build_editable) support.
# We require >= 68 to pick up modern wheel-building behavior.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# --- uv-specific configuration (ignored by pip) -----------------------------
# Direct torch to the CUDA-12.4 wheel index. We use `explicit = true` so the
# custom index is ONLY consulted for torch — every other dependency still
# resolves against PyPI normally. Adjust the URL if your driver supports a
# different CUDA runtime:
#   cu121  -> https://download.pytorch.org/whl/cu121
#   cu124  -> https://download.pytorch.org/whl/cu124   (default; matches the cluster)
#   cu126  -> https://download.pytorch.org/whl/cu126
#   cu128  -> https://download.pytorch.org/whl/cu128
#   cpu    -> https://download.pytorch.org/whl/cpu

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
