[project]
name = "scgg"
version = "0.1.0"
description = "Spatial Graph Generation via Conditional Flow Matching"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scanpy>=1.9",
    "anndata>=0.9",
    "faiss-cpu>=1.7",
    "wandb>=0.15",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scgg", "scgg.*"]

[tool.setuptools.package-data]
"scgg.configs" = ["*.yaml"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
