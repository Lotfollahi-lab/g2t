[project]
name = "scgg"
version = "0.1.0"
description = "Spatial Graph Generation via Conditional Flow Matching"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scanpy>=1.9",
    "anndata>=0.9",
    "faiss-cpu>=1.7",
    "wandb>=0.15",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scgg", "scgg.*"]

[tool.setuptools.package-data]
"scgg.configs" = ["*.yaml"]

[build-system]
# setuptools >= 64 is the first version with PEP 660 (build_editable) support.
# We require >= 68 to pick up modern wheel-building behavior.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# --- uv-specific configuration (ignored by pip) -----------------------------
# Direct torch to the CUDA-12.4 wheel index. We use `explicit = true` so the
# custom index is ONLY consulted for torch — every other dependency still
# resolves against PyPI normally. Adjust the URL if your driver supports a
# different CUDA runtime:
#   cu121  -> https://download.pytorch.org/whl/cu121
#   cu124  -> https://download.pytorch.org/whl/cu124   (default; matches the cluster)
#   cu126  -> https://download.pytorch.org/whl/cu126
#   cu128  -> https://download.pytorch.org/whl/cu128
#   cpu    -> https://download.pytorch.org/whl/cpu

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
