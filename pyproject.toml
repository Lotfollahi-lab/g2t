[project]
name = "scgg"
version = "0.2.0"
description = "Spatial Graph Generation — LUNA codebase under the hood, scGG entry points"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scanpy>=1.9",
    "anndata>=0.9",
    "faiss-cpu>=1.7",
    "wandb>=0.15",
    # LUNA's runtime dependencies — vendored verbatim under scgg/src/{models,
    # utils, metrics, datasets, configs}, called via Hydra. Keep these pinned
    # loosely (>=) so we can pull patches from upstream LUNA without
    # re-specifying versions here.
    "pytorch-lightning>=2.0",
    "torch-geometric>=2.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "linear-attention-transformer>=0.19",
    "pandas>=2.0",
]

[project.optional-dependencies]
gpu = [
    "faiss-gpu>=1.7",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.4",
]

# Source layout is src/. Map the empty package root to src/ so BOTH
# `packages` AND `py-modules` resolve relative to src/.
#
# We enumerate every package explicitly instead of using
# `[tool.setuptools.packages.find]`. The find-based approach kept
# silently dropping packages from uv's editable install (specifically
# `utils.data` and the PEP-420 namespace packages under
# `utils.diffusion_model.*`) even with `namespaces = true`. Listing
# them by name removes that whole class of failure: every dotted
# import the LUNA codebase needs is registered.
#
# If upstream LUNA gains a new subpackage, add it here.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "diffusion_model"]
packages = [
    # scGG-side package (eval helpers, h5ad loaders, scripts entry points)
    "scgg",
    "scgg.data",
    "scgg.evaluation",
    # LUNA top-level packages, vendored verbatim under scgg/src/
    "models",
    "metrics",
    "datasets",
    "utils",
    "utils.data",
    "utils.diffusion_model",
    "utils.diffusion_model.diffusion",
    "utils.diffusion_model.sample",
    "utils.diffusion_model.setup",
    "utils.diffusion_model.test",
    "utils.diffusion_model.train",
    "utils.diffusion_model.validation",
    # LUNA Hydra config tree (the yaml files are package-data below)
    "configs",
    "configs.experiment",
    "configs.general",
    "configs.model",
    "configs.test",
    "configs.train",
    "configs.validation",
]

[tool.setuptools.package-data]
# LUNA's Hydra configs are YAML files inside the `configs` package; they
# must be included in the wheel so Hydra can discover them at runtime.
"configs" = ["**/*.yaml"]

[build-system]
# setuptools >= 64 is the first version with PEP 660 (build_editable) support.
# We require >= 68 to pick up modern wheel-building behavior.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# --- uv-specific configuration (ignored by pip) -----------------------------
# Direct torch to the CUDA-12.4 wheel index. We use `explicit = true` so the
# custom index is ONLY consulted for torch — every other dependency still
# resolves against PyPI normally. Adjust the URL if your driver supports a
# different CUDA runtime:
#   cu121  -> https://download.pytorch.org/whl/cu121
#   cu124  -> https://download.pytorch.org/whl/cu124   (default; matches the cluster)
#   cu126  -> https://download.pytorch.org/whl/cu126
#   cu128  -> https://download.pytorch.org/whl/cu128
#   cpu    -> https://download.pytorch.org/whl/cpu

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
