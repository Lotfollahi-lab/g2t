data:
    value:
        coord_augment_rotation: true
        coord_center: true
        coord_normalize: per_section
        data_dir: ./data/merfish
        dataset: merfish
        gene_list: null
        min_cells_per_section: 100
        n_top_hvg: null
        normalize: true
        scale: true
evaluation:
    value:
        k_values:
            - 5
            - 10
            - 15
            - 20
        metrics:
            - edge_f1
            - neighborhood_composition
            - spatial_autocorrelation
            - degree_distribution
        n_eval_sections: 5
        n_samples: 5
graph:
    value:
        backend: faiss
        k_default: 10
        k_train_probs: null
        k_train_range:
            - 5
            - 30
        metric: euclidean
model:
    value:
        encoder:
            dropout: 0.1
            embed_dim: 128
            hidden_dims:
                - 512
                - 256
            norm: layernorm
        flow:
            n_steps: 100
            sigma_min: 0.0001
            solver: euler
        section_encoder:
            embed_dim: 64
            hidden_dim: 128
            n_attention_heads: 4
            subsample_size: 4096
        spatial_dim: 2
        velocity_net:
            dropout: 0.1
            hidden_dims:
                - 512
                - 512
                - 256
            k_embed_dim: 16
            time_embed_dim: 64
training:
    value:
        batch_size: 8192
        checkpoint_dir: ./checkpoints
        epochs: 5
        eval_every: 5
        grad_clip: 1
        log_every: 100
        loss:
            contrastive_n_negatives: 64
            contrastive_spatial: 0.1
            contrastive_temperature: 0.1
            flow_matching: 1
        lr: 0.001
        optimizer: adamw
        save_every: 10
        scheduler: cosine
        sections_per_epoch: null
        seed: 42
        wandb: true
        wandb_project: scgg
        wandb_run_name: null
        wandb_tags: []
        warmup_epochs: 10
        weight_decay: 0.0001
