
n_epochs: 3000 # Number of epochs
batch_size: 1 # Batch size for training
lr: 5e-4 # Learning rate
fast_dev_run: False # If True, runs 1 batch of train, test and val to find any bugs
weight_decay: 1.0e-12

# ---------------------------------------------------------------------------
# Autograd anomaly detection.
# ---------------------------------------------------------------------------
# When true, calls torch.autograd.set_detect_anomaly(True, check_nan=True)
# before training starts. This makes PyTorch:
#   1. Save the forward-pass stack trace of every op.
#   2. On backward, if any op produces NaN/Inf gradient, raise an
#      error AND print the saved forward trace pointing at the
#      EXACT op (file + line) that produced it.
# Cost: ~5-10x slower training because of the saved-stack overhead.
# Use ONLY for debugging — flip back to false for real runs.
#
# Typical workflow when a NaN gradient kills a run:
#   --override train.detect_anomaly=true
# Re-run for a few steps until the NaN fires. Read the printed
# forward stack to find the unstable op. Stabilise it at the source
# (see models/edm_head.py::_classical_mds_2d for the Tikhonov
# pattern), then flip detect_anomaly back off for production runs.
detect_anomaly: false

# ---------------------------------------------------------------------------
# Gradient clipping (by norm) before each optimizer step.
# ---------------------------------------------------------------------------
# Bounds the L2 norm of the gradient vector across ALL parameters to
# at most this value. Defense-in-depth against large-but-finite
# gradients that accumulate to Inf — particularly relevant for runs
# that flow gradient through eigh / SVD ops (e.g.
# ``model.edm.mds_align_gradient=true`` or the Procrustes-aligned
# Sinkhorn loss). PL surfaces a "clipped" log event when clipping
# actually fires, so this isn't silent — you can SEE when training
# is hitting the cap.
#
# Default 1.0 is a standard transformer-training value (Vaswani et
# al., used in BERT / GPT / etc). Set to 0 to disable.
gradient_clip_val: 1.0

# ---------------------------------------------------------------------------
# Trainer numerical precision (PyTorch Lightning ``precision``).
#   "32-true"   — full fp32 (default; byte-identical to existing runs).
#   "bf16-mixed"— bfloat16 autocast + fp32 master weights. ~2-3x faster
#                 matmuls on tensor cores AND ~half the activation memory
#                 (both backbone and loss). Safe for this model: the only
#                 fp64-sensitive op (the MDS eigh) is skipped at train via
#                 model.edm.skip_edm_D_train, and at inference it runs in
#                 eval (autocast off) with its own fp64 promotion. bf16's
#                 wide exponent avoids the fp16 overflow risk, so no loss
#                 scaler is needed. Turn on with
#                 ``--override train.precision=bf16-mixed``.
#   "16-mixed"  — fp16 autocast (narrower range; needs a grad scaler).
# Other Lightning-accepted strings ("64-true", "bf16", ...) pass through.
precision: "32-true"

# ---------------------------------------------------------------------------
# Train-time rotation+reflection augmentation.
#
# Each training step applies an INDEPENDENT random element of O(2)
# (rotation + optional reflection) to every slice in the batch.
# Gene features are scalars and stay untouched; only positions are
# transformed. The pairwise-distance loss is O(2)-invariant, so
# augmenting the input data and leaving targets in their (also-
# transformed) frame is a no-op for the loss but forces the network
# to be invariant to the input rotation/reflection.
#
# Why
# ---
# LUNA's transformer has no built-in rotation invariance — it has to
# learn it from data. The MMC cortex dataset has only ~6 slices, so
# the network sees the SAME six absolute orientations every epoch
# and learns a frame-specific solution. Augmentation breaks that
# correlation: each step the network sees a fresh random orientation
# of each slice. Same effect as EGNN's built-in equivariance, but
# applied to the cheaper transformer backbone.
#
# Defaults OFF for reproducibility of the prior baseline. Turn ON
# per-run via:
#     --override train.augment_rotation=true
# and give the run a descriptive --wandb_run_name so it shows up as
# an identifiable variant.
# ---------------------------------------------------------------------------
augment_rotation: false   # if true, apply random rotation per slice per step
augment_reflection: false # if true, also flip x-axis with p=0.5 (full O(2)
                          # rather than just SO(2)). Tissue slices are
                          # chirally symmetric in expectation, so this is
                          # usually safe — but worth its own toggle in case
                          # the dataset has a real chirality signal.

# ---------------------------------------------------------------------------
# Train-time gene-expression augmentation.
# ---------------------------------------------------------------------------
# Three independent regularisers on the gene-expression INPUT (NOT
# the positional target). Each is OFF by default; set the non-zero
# parameter to enable. They compose: dropout → noise → mixup.
#
# Free at inference — the augmentation runs INSIDE training_step
# and inference uses the un-augmented gene vectors directly. So
# enabling any of these costs only train-time compute (tiny —
# pointwise ops on the gene tensor) but applies forever after via
# the trained weights.
#
# When to use which
# -----------------
# * gene_augment_dropout_p: gene-level "this gene wasn't measured"
#   noise. Best when the dataset has known under-detection (low-
#   expression genes get false zeros). Typical 0.1-0.2. Strongest
#   regulariser of the three.
#
# * gene_augment_noise_sigma: additive Gaussian on gene values,
#   scaled by the batch-stddev of real gene values so the absolute
#   noise level is normalisation-agnostic. Targets measurement
#   noise. Typical 0.05-0.1.
#
# * gene_augment_mixup_alpha: cell-level mixup. Each cell's gene
#   vector is blended with a randomly-chosen within-slice partner
#   with λ ~ Beta(α, α). Position TARGETS are NOT mixed — only the
#   gene input. Forces the model to use spatial context (other cells'
#   genes via attention) rather than relying purely on the focal
#   cell's gene vector. Typical α = 0.2-0.4.
#
# Recommended starting ablation: pick ONE at a time. Stacking can
# interact non-trivially and obscure which signal helped.
gene_augment_dropout_p: 0.0
gene_augment_noise_sigma: 0.0
gene_augment_mixup_alpha: 0.0

# ---------------------------------------------------------------------------
# Exponential moving average of model weights.
#
# Each train step (after the optimizer update), maintain a shadow
# copy θ_EMA = decay · θ_EMA + (1 - decay) · θ. Validation, test,
# and CHECKPOINT-SAVE all use θ_EMA instead of the live training
# weights. Inference loads the checkpoint normally and therefore
# gets EMA-by-default — no inference-side changes needed.
#
# Why
# ---
# Late-training oscillation in the loss landscape means the
# instantaneous θ at step N is rarely the best-generalizing model.
# A long EMA smooths over that oscillation and consistently
# improves test-time metrics. Standard trick in diffusion (Karras
# et al., Stable Diffusion 3) and flow matching.
#
# Defaults OFF for byte-equivalence with the prior baseline. Enable
# with `--override train.ema_decay=0.999`. Common values: 0.999
# (decay over ~1k steps, "fast" EMA), 0.9999 (decay over ~10k
# steps, "slow" EMA — only use for long runs).
# ---------------------------------------------------------------------------
# DEFAULT FLIPPED 2026-05-25 from 0.0 to 0.95. EMA at decay 0.95
# (~14-step half-life across cortex's ~6000 total steps) was a
# consistent positive on top of every other ablation, including
# EDM-FM (the new default model framework). It composes orthogonally
# with EDM and adds no parameters. Pass
# ``--override train.ema_decay=0.0`` to disable EMA (e.g. for byte-
# equivalence with the original LUNA baseline).
ema_decay: 0.95           # 0 disables the EMA callback entirely
ema_every_n_steps: 1      # update EMA every N optimizer steps; >1 saves a
                          # tiny bit of compute, almost never used

# NOTE: ``gene_reconstruction`` and ``self_conditioning`` USED to live
# here in cfg.train, but they affect the MODEL'S ARCHITECTURE (the
# self-cond bump changes the inner backbone's input_dim; the
# gene-recon head is a module on the LightningModule). The inference
# pipeline restores ``cfg.model`` from the training snapshot but
# NOT ``cfg.train`` — so train-side knobs that change architecture
# break checkpoint loading at inference. They've been moved to
# ``cfg.model.{self_conditioning, gene_reconstruction}`` (see
# configs/model/default.yaml) so the snapshot-restore picks them up
# automatically. Same pattern as ``cfg.model.coarse_to_fine`` and
# ``cfg.model.hierarchical``.