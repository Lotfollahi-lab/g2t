# Training paradigm / generative framework selector.
# - "diffusion"      — LUNA's original DDPM. Forward: x_t = sqrt(αₜ)·x_0
#   + sqrt(1−αₜ)·ε with the cosine β schedule. Reverse: 1000 sequential
#   denoising steps. This is the default — `luna_train.py` always uses
#   it (it runs the external LUNA repo, untouched).
# - "flow_matching"  — scgg's faster alternative. x_0-parameterised
#   rectified flow: forward is linear interpolation x_t = (1−t)·x_0 +
#   t·x_1 with x_1 ~ 𝒩(0, I) and t ~ 𝒰(ε, 1). The network predicts
#   clean positions; loss is identical to the diffusion path (pairwise
#   distance MSE + any opt-in components). Sampling is a 50-step Euler
#   ODE solve instead of 1000 DDPM steps — that's the 20× wall-clock
#   win at inference. Training cost per step is the same; the
#   simpler loss landscape often converges in fewer epochs.
# - "regression"     — NO generative process. Direct supervised
#   prediction: backbone maps (gene_expression, mask) → positions,
#   loss is the same pairwise-distance MSE (+ any opt-in components).
#   Diagnostic experiment: does the generative paradigm actually
#   help on small datasets like cortex's 6 slices, or is it just
#   wrapping the predictor in a sample-inefficient framework?
#   Generative models need to learn the FULL conditional p(pos|gene)
#   from finite data; regression only needs the conditional MEAN —
#   often much more sample-efficient on tiny datasets. Implementation
#   reuses the same Lightning machinery: a ``RegressionPredictor``
#   exposes the SAME 3-method interface as the noise models, but
#   ``apply_noise`` returns zeroed positions at t=1 (network sees
#   no positional info — must predict positions from genes alone),
#   and the "sampling loop" iterates exactly once (max_diffusion_
#   steps=1) → one forward → return the prediction.
#
#   Implementation contract: all three classes expose the SAME
#   methods (apply_noise / sample_limit_dist /
#   sample_zs_from_zt_and_pred) so the Lightning class, training
#   step, and sampling loop are framework-agnostic — the only branch
#   point is which class fills `self.noise_model` at __init__.
# DEFAULT FLIPPED 2026-05-25 from "diffusion" to "flow_matching" after the
# scgg_mmc_edm_fm series became the best-performing config — running EDM on
# top of the FM trajectory was the winning combination on cortex and is now
# the default starting point. Pass ``--override model.framework=diffusion``
# to reproduce the original LUNA-style DDPM baseline.
framework: "flow_matching"

# Backbone architecture selector (independent of `framework`).
# - "luna_transformer" — LUNA's original architecture: 3-stream
#   (node features / diffusion time / positions) transformer with
#   linear attention and position-direction-conditioned attention.
#   Translation-invariance via mean-subtraction; rotation invariance
#   has to be learned from data.
# - "egnn"             — scgg's SE(2)-equivariant backbone. Built-in
#   translation AND rotation equivariance via the standard
#   Satorras et al. 2021 message-passing update on relative vectors.
#   Same input/output interface as the LUNA Model so it drops in
#   under the same training/inference pipeline.
# - "dit"              — DiT (Peebles & Xie 2022) with adaLN-Zero
#   time conditioning. Dense softmax self-attention via SDPA /
#   FlashAttention-2 (O(N²) compute, O(N) memory).
# - "perceiver"        — Perceiver-IO style anchored attention with
#   K learnable anchor tokens. O(N·K) compute via SDPA cross-
#   attention; preserves all-to-all reachability through the
#   anchor bottleneck. Good for very large N when K is small.
# - "nystromformer"    — Nyström-approximated global self-attention
#   (Xiong et al. 2021). Sub-quadratic O(N·M) cost via segment-mean
#   landmark pooling + Moore-Penrose pseudo-inverse. Preserves
#   true all-to-all reachability without imposing a sparsity
#   pattern. Strongest theoretical guarantee among the sub-
#   quadratic options here (Nyström decomposition is a low-rank
#   factorisation that approaches exact softmax as M → N).
#   Hybrid switch: at M = exact_until_n the layer falls through to
#   exact SDPA, so small slices don't pay the Nyström overhead.
# - "geomattn_localglobal" — Geometry Local-Global Attention. Exact
#   full softmax over each cell's top-K nearest cells (kNN under the
#   current coordinate estimate) PLUS a landmark-global far field.
#   Two combine schemes (model.geomattn_localglobal.combine):
#     "gated"   — out = g·local + (1-g)·global (Nyström far field),
#                 learned per-head blend. No double-counting.
#     "unified" — ONE softmax over {K nearest cells} ∪ {M landmarks},
#                 each landmark weighted by its per-query effective
#                 cell count (with local-neighbour exclusion → EXACT
#                 dense softmax in the K→N limit).
#   O(N·(K+M)); kNN computed once per forward. See
#   model.geomattn_localglobal below.
# - "geomattn_nystrom" — Geometry-Coupled Nyström Attention. The
#   scalable counterpart to "geomattn": injects the same learnable,
#   time-gated, SE(2)-invariant geometric bias, but at the LANDMARK
#   level (cell↔landmark-centroid + centroid↔centroid distances, where
#   a landmark's centroid is the segment-mean of its cells' positions).
#   Both the attention and the bias are O(N·M), not O(N²). Recovers
#   dense "geomattn" at M ≥ N. Use for large slices where dense
#   geomattn OOMs. See model.geomattn_nystrom below.
# - "geomattn"         — Geometry-Coupled Attention. DiT-style backbone
#   whose dense softmax attention carries an ADDITIONAL learnable,
#   time-gated, SE(2)-invariant geometric bias derived from the
#   CURRENT coordinate estimate x_t:
#       score_ij += gamma_h(t) · K_h(||x_t,i - x_t,j||)
#   so attention attends preferentially to cells that are spatially
#   near under the current prediction. The attention pattern and the
#   geometry co-evolve along the FM sampling trajectory (content-driven
#   at high noise, spatially-local at low noise). The per-head time
#   gate gamma_h(t) is zero-init ⇒ identical to DiT at init, learns the
#   coarse-to-fine schedule. O(N²) memory like DiT (see model.geomattn
#   block below). This is the primary methodological contribution under
#   evaluation — distinct from linear/Nyström/Perceiver, which change
#   how cheaply attention is computed, not what it attends to.
backbone: "luna_transformer"

# Auxiliary-stream ablation. LUNA feeds the current noisy 2D coordinate
# estimate back into every attention layer as a per-cell "delta" feature
# (the direction-from-centroid unit vector). That feature is GAUGE-VARIANT
# (rotates/reflects with the slice) even though the target and metric are
# gauge-invariant — a candidate cause of weak cross-sample generalization.
#   * "absolute" (default): historic behaviour — byte-identical.
#   * "off": sever the coordinate feedback (delta slot zeroed; param shapes
#     unchanged, so checkpoints stay compatible). Tests whether the
#     intermediate-coordinate self-conditioning is needed at all — expected
#     to be near-redundant on the EDM/relational path, which reconstructs
#     geometry from predicted distances rather than the fed-back coordinate.
# Only the DIRECT luna_transformer backbone honours this (no hier/c2f wrapper).
position_feedback: "absolute"

n_layers: 8 # Number of transformer/EGNN layers
diffusion_noise_schedule: cosine # noise schedule for diffusion time
diffusion_steps: 1000 # number of diffusion steps (DDPM only — FM ignores this; see flow_matching.n_sampling_steps below)

# ---------------------------------------------------------------------------
# Flow-matching hyperparameters. Only consulted when `framework: "flow_matching"`.
#
# n_sampling_steps  — number of Euler ODE steps at INFERENCE time.
#                     50 is the canonical rectified-flow default; the
#                     ODE is smooth so quality plateaus quickly past
#                     ~20-30 steps. Set to 25 for an extra 2× inference
#                     speedup if quality is acceptable.
# eps_t             — minimum sampled t during training. The velocity
#                     parameterisation has a 1/t factor in the Euler
#                     step, so very-tiny t at training time creates
#                     huge implicit x_1 estimates and noisy gradients.
#                     1e-3 is the standard rectified-flow choice.
# ---------------------------------------------------------------------------
flow_matching:
    n_sampling_steps: 50
    eps_t: 1.0e-3
    # Prediction target.
    # - "x0" — network outputs predicted clean positions. Loss is on
    #          positions directly. This is the default and matches
    #          LUNA's transformer (which outputs absolute positions).
    # - "v"  — network outputs the velocity field v = x_1 - x_0.
    #          LightningModule converts to x_0_pred = x_t - t·v_pred
    #          at the forward() boundary, so the LOSS and SAMPLER stay
    #          unchanged (both still see x_0_pred vs x_0). The point
    #          is the GRADIENT SIGNAL: v-pred's gradient w.r.t. the
    #          network output is roughly uniform across noise levels,
    #          whereas x_0-pred's gradient vanishes as t→0 (the
    #          target x_0 ≈ x_t in that limit). This often helps
    #          architectures whose natural output is "near identity"
    #          at init (like EGNN's residual-only updates) by giving
    #          a stronger learning signal at low noise.
    #
    # When prediction=v AND backbone=egnn, EGNN automatically
    # switches to outputting only the cumulative residual
    # R = Σℓ Δxℓ (instead of x_t + R). This makes the network's
    # raw output ≈ 0 at init, which is the right initial state
    # for v_pred (v_target has magnitude ~1, but starting at 0
    # is symmetric and gradient-friendly).
    prediction: "x0"
    # ODE sampler order.
    # - "euler"  — 1st-order. One network forward per ODE step.
    #              Default, matches the original FM rollout.
    # - "heun"   — 2nd-order ("improved Euler" / trapezoidal). Two
    #              forwards per step: predict z_s with Euler, then
    #              re-evaluate the velocity at that point and average
    #              with the velocity at z_t. Halves discretization
    #              error, so the same sample quality is reached in
    #              roughly half the steps. At the LAST step (s=0)
    #              the 1/s factor in the velocity diverges; we fall
    #              back to Euler there automatically.
    #
    # Effective inference cost: heun with 25 steps ≈ euler with 50
    # steps in wall-clock (same number of forwards), but heun's
    # truncation error is O(dt²) vs euler's O(dt) → quality wins
    # at equal cost. For absolute quality keep euler at 50 steps
    # AND switch to heun (cost doubles, quality gain comes on top).
    sampler: "euler"

    # -----------------------------------------------------------------
    # FM endpoint (x_1, the "noise" the trajectory starts from).
    # -----------------------------------------------------------------
    # By default ``x_1 ∼ N(0, I)`` — the standard rectified-flow prior.
    # The model has to spend its early ODE steps moving each cell from
    # arbitrary noise positions toward each cell type's spatial niche.
    #
    # "empirical_gmm" replaces this with a per-cell-type Gaussian
    # Mixture fit on the training data by
    # ``scripts/precompute_prior_pool.py``. Each cell's x_1 is drawn
    # from a GMM specific to its cell class, then scaled by the
    # slice's bounding-box diagonal (computed from x_0 at training,
    # the train-median ``default_scale`` at inference).
    #
    # Rotation invariance
    # -------------------
    # The GMM is fit on per-slice-normalized (centered + scaled) but
    # NOT rotated positions. Slices in their native orientations all
    # contribute to the same GMM, so the resulting prior is rotation-
    # averaged in distribution — it captures rotation-INVARIANT
    # features (radial profile, anisotropy magnitude) of each cell
    # type's spatial layout, NOT rotation-specific features (e.g. "L1
    # neurons always at the top"). Compatible with
    # ``train.augment_rotation=true``.
    #
    # When this helps
    # ---------------
    # When the gap between ``N(0, I)`` and the true spatial niche of
    # each cell type is large enough that the model spends learning
    # capacity figuring out "broadly where to put each cell type"
    # before refining placement. For layered tissues like cortex this
    # is plausibly significant — neurons of layer 2/3 occupy a
    # narrow radial band that ``N(0, I)`` doesn't suggest at all.
    #
    # Default mode "gaussian" preserves the legacy behavior
    # byte-identically. Switch to "empirical_gmm" per-run via override.
    prior_mode: "gaussian"
    # Path to the .pkl produced by ``scripts/precompute_prior_pool.py``.
    # Required when ``prior_mode == "empirical_gmm"``; ignored
    # otherwise. Cluster-default convention: alongside the silver h5ads.
    prior_pool_path: null

    # -----------------------------------------------------------------
    # learned_regression prior (MixFlow-style informed prior).
    # -----------------------------------------------------------------
    # A third prior_mode. A small LEARNED head predicts each cell's
    # coarse CANONICAL-frame position from its node_features (gene
    # expression, or Nicheformer embeddings if those ARE the
    # node_features via the obsm gene-encoder pathway). The FM then
    # starts from N(μ(features), prior_sigma²) instead of N(0, I), so it
    # only makes small corrections (cf. MixFlow's condition-dependent
    # base + geodesic loss). The head is trained by a geodesic MSE
    # ‖μ − x0_canonical‖² (weight ``prior_geo_weight``); its DETACHED
    # output re-centres the source Gaussian (no FM→prior feedback).
    #
    # REQUIRES ``canonicalize_target=true`` (a per-cell point prior is
    # only well-defined in a fixed frame — guarded in diffusion_model).
    # Coordinate-space FM only (not edm.diffuse_in_embed_space=true).
    # Default off (prior_mode stays "gaussian").
    prior_sigma: 1.0       # std of the informed Gaussian around μ
    prior_hidden: 128      # hidden width of the prior-head MLP (LazyLinear in)
    prior_geo_weight: 1.0  # weight of the geodesic MSE that trains the head
    # Restrict the prior head's INPUT to the last-K node-feature columns.
    # 0 (default) = use the full feature vector (byte-identical). Set to the
    # scVI conditioning dim (e.g. 10, when prep.conditioning_field=scvi_10
    # appended a 10-D scVI latent as the LAST block of node_features) so the
    # coarse positional prior is regressed from the batch-corrected cell-
    # state embedding alone (MixFlow-style decomposition: scVI -> coarse
    # prior, raw genes -> fine FM correction). The FM backbone still sees
    # the full features.
    prior_input_last_k: 0

    # -----------------------------------------------------------------
    # Gauge-fixed flow matching (canonical-frame target).
    # -----------------------------------------------------------------
    # A cell cloud's absolute coordinates are defined only up to a rigid
    # motion + reflection (SE(2)/O(2)); the EDM distance loss and the
    # per-cell Spearman metric are both invariant to it. Standard
    # coordinate FM regresses toward ONE arbitrary rotated/reflected
    # copy of the target, so the model burns capacity being equivariant
    # (hence train.augment_rotation/reflection — stochastic frame
    # averaging — plus Procrustes alignment).
    #
    # When true, the FM TARGET is mapped to its unique canonical frame
    # (mean-centred, PCA-rotated so the principal axis is x, skew-sign-
    # fixed) before the interpolant is built — DETERMINISTIC frame fixing
    # in place of stochastic augmentation. The transform is an isometry,
    # so it does NOT change any pairwise distance (the loss is
    # unaffected); it only makes the frame the backbone sees consistent
    # across slices and epochs. See utils/data/canonicalize.py.
    #
    # This single flag drives BOTH variants:
    #   * Option 1 (coordinate flow): framework=flow_matching, edm on,
    #     edm.diffuse_in_embed_space=false — canonicalises x_0.
    #   * Option 2 (relational / h-space flow):
    #     edm.diffuse_in_embed_space=true — canonicalises the 2D
    #     positions before they are lifted to the k-D h_0 target, which
    #     removes the O(2) gauge h-space FM otherwise inherits.
    #
    # Default false keeps every existing run byte-identical. Best paired
    # with train.augment_rotation=false / augment_reflection=false
    # (canonicalisation makes them redundant — canonicalize∘augment =
    # canonicalize).
    canonicalize_target: false
nu:
    p: 2

# ---------------------------------------------------------------------------
# Input projection for the node-features MLP.
# ---------------------------------------------------------------------------
# These knobs only affect ``Model.mlp_in_node_features`` (the gene /
# embedding → hidden projection at the very front of the network).
# Defaults reproduce the historic behaviour byte-identically — leave
# alone for byte-equivalence with prior runs.
#
# When the model input is RAW gene expression (the default — non-
# negative, sparse, with magnitudes the dataloader has already
# normalized), ReLU + no-LayerNorm + no-dropout is fine. ReLU acts
# near-identity on the positive half of the gene distribution.
#
# When the model input is a PRETRAINED EMBEDDING (Nicheformer,
# scGPT, scVI's latent — dense, real-valued, BOTH-SIGN), ReLU zeros
# out the negative half of every dimension at the first hidden
# layer — losing ~50% of the embedding's information that no later
# layer can recover. For these inputs:
#   * ``activation: "gelu"`` (or "silu") — passes the negative half
#     through with smooth saturation. Mathematically a near-superset
#     of ReLU on positives, so it doesn't degrade raw-gene runs.
#   * ``layernorm: true`` — calibrates per-cell embedding scale,
#     which the dataloader doesn't control for obsm-sourced inputs.
#   * ``dropout: 0.0`` — pretrained embeddings are deterministic per
#     cell, so the model can memorise patterns. A 0.1-0.2 dropout
#     here acts as input-level regularisation. Off by default
#     because raw-gene inputs already have measurement noise.
#
# Recommended starting overrides for a Nicheformer / pretrained run:
#   model.input_projection.activation=gelu
#   model.input_projection.layernorm=true
#   model.input_projection.dropout=0.1
input_projection:
    activation: "relu"   # one of: relu | gelu | silu
    layernorm: false
    dropout: 0.0

hidden_mlp_dims:
    X: 256 # hidden dimension of the MLP for cellular features
    y: 256 # hidden dimension of the MLP for diffusion time
    pos: 64 # hidden dimension of the MLP for position
hidden_dims:
    dx: 256 # hidden dimension of the MLP for cellular features
    dy: 1 # hidden dimension of the MLP for diffusion time
    num_heads: 16 # number of heads in the multi-head attention
    dim_ffX: 256 # hidden dimension of the cellular features feedforward network in the transformer
    dim_ffy: 256 # hidden dimension of the diffusion time feedforward network in the transformer
    dd: 64 # hidden dimension of the MLP for positions
    # DEFAULT FLIPPED 2026-05-25 from 4 to 32. The 4-D bottleneck was a
    # LUNA-side choice driven by the position-MLP's needs (it only needed
    # enough channels to feed mlp_out_pos_norm); for EDM the same channel
    # also feeds the projector that produces the per-cell relational
    # embedding, and 4 was starving it. Widening to 32 (the
    # ``scgg_mmc_edm_fm_outwidth32`` run) was the strongest single-knob
    # win in the latest ablation sweep. Pass ``--override
    # model.hidden_dims.output_features_to_pos_dims=4`` for LUNA-byte-
    # equivalent baselining.
    output_features_to_pos_dims: 32 # hidden dim of the MLP for the output features to positions

# ---------------------------------------------------------------------------
# Loss components (scgg ablation knobs).
#
# The original LUNA loss is `pairwise_distance_mse`: per-slice MSE on the
# full pairwise-distance matrix. It's the unconditional default and acts
# as the rotation-invariant skeleton — we keep it on for every scgg
# experiment unless explicitly ablated away.
#
# Each additional component below is OFF by default (so the default config
# is byte-equivalent to LUNA's loss). Flip `enabled: true` on the
# component you want to ablate AND give the run a descriptive
# `--wandb_run_name` so it shows up as an identifiable variant in the
# artifacts tree. The full composed config is also dumped to
# `<run_dir>/.hydra/config.yaml`, so the exact weights / k / etc. of any
# past run are recoverable from disk.
#
# Whenever you add a NEW component:
#   1. Add its block here with `enabled: false` (default off).
#   2. Add a `compute_<name>(...)` method to scgg/src/metrics/loss_function.py
#      and wire it into `LossFunction.compute_loss`.
#   3. Document the ablation contract in this file's comment block.
# ---------------------------------------------------------------------------
loss:
    # LUNA's headline loss. Per-slice MSE on the pairwise-distance matrix.
    # Rotation/translation invariant. Always on unless you explicitly ablate.
    pairwise_distance_mse:
        enabled: true
        weight: 1.0

    # Rank-preservation correlation loss. Per-cell Pearson correlation
    # between true/pred pairwise-distance rows; loss is
    # ``1 - mean(corr)``. Tested both global (full row, mirrors eval
    # metric) and local (k-NN only) scopes — neither helped on the
    # MMC cortex baseline. Kept here as a configurable knob for
    # future ablations but DEFAULT OFF and we've moved on to the PH
    # loss below.
    knn_rank:
        enabled: false
        scope: global  # "global" (full row) or "local" (k-NN only)
        weight: 0.05
        k: 20          # only used when scope=local

    # 0-dim persistent homology loss (MST / Wasserstein-2² formulation).
    #
    # The 0-dim persistence diagram of a finite point cloud is exactly
    # the multiset of MST edge lengths: each cell is "born" at filtration
    # time 0 and "dies" by merging into another component at the next
    # MST edge it sits on. So for an N-cell slice, PD_0 = sorted (N-1)
    # MST edge lengths. Wasserstein-2² between two equal-cardinality
    # PDs collapses to MSE between the sorted-edge-length vectors —
    # which is differentiable through the predicted distance matrix
    # via gather + sort (the MST STRUCTURE is determined
    # non-differentiably by scipy, but the LENGTHS at those edge
    # indices flow gradients back to pred coords). This is the
    # standard "fixed structure" differentiable-persistence trick
    # (Bruel-Gabrielsson et al. 2020; Hofer et al. 2019).
    #
    # Motivation: LUNA's pairwise-distance MSE penalises every pair
    # uniformly. The MST edges are the "skeleton" that determines
    # the cluster structure of the tissue; aligning them captures
    # cell-density topology that pairwise MSE smears across all
    # N² pairs.
    #
    # 1-dim PH (loop / region structure) is supported via gudhi's
    # Vietoris-Rips complex (dim=1). Where 0-dim PH penalises
    # mismatched connectivity (MST edge length distribution),
    # 1-dim PH penalises mismatched LOOPS — exactly the failure
    # mode that produced donut-shaped predictions in the 0-dim
    # experiments. The differentiable formulation follows the
    # standard "fixed structure" trick (Hofer 2019,
    # Bruel-Gabrielsson 2020): gudhi computes WHICH simplices form
    # each persistence pair (non-differentiably), and we re-compute
    # the (birth, death) VALUES from the gradient-bearing pairwise
    # distance matrix. Matching between predicted and true
    # persistence diagrams uses sorted-lifetime matching with
    # diagonal padding (a tractable approximation to true
    # Wasserstein-2² that's smooth in the input coordinates).
    #
    # Implementation cost: scipy MST (dim=0) is CPU-side (~tens of
    # ms for N=10k). gudhi VR (dim=1) is more expensive because
    # the complex has up to O(N³) simplices for max_dimension=2 —
    # we limit it via ``max_edge_length`` to a fraction of the
    # tissue scale, which makes the complex O(N · density · K²)
    # in practice. ``subsample`` and ``frequency`` are stackable
    # for further speedup.
    persistent_homology:
        enabled: false
        weight: 0.5       # same units as pairwise_distance_mse; 0.5 = roughly co-equal
        subsample: null   # null = use all cells; integer caps per-slice n for speed
        dim: 0            # 0 = MST (scipy); 1 = loops (gudhi VR)
        # Vietoris-Rips max edge length (in normalised coord units).
        # Only consulted when dim=1. Limits the simplex tree to local
        # edges, which is what loop structure cares about anyway and
        # keeps the complex tractable. For cortex's [-0.5, 0.5]
        # normalised positions, 0.2 captures laminar-scale loops
        # without exploding memory. Lower → faster but may miss real
        # large-scale loops; higher → slower, may include noise.
        max_edge_length: 0.2
        # Speed knobs (all stackable):
        #
        # frequency: compute PH every N training steps. Other steps
        # contribute a detached zero. The gradient direction is
        # identical to frequency=1, just sampled. Default 1 (every
        # step); raise to 10 for a 10× wall-clock speedup with
        # minimal effect on convergence.
        frequency: 1
        # cache_true: keep a small per-slice cache of the true MST
        # edge lengths, keyed by a content fingerprint of the true
        # positions tensor. True positions never change across
        # epochs, so the true cdist + scipy MST should run once per
        # slice, not once per slice per step. ~2× speedup on top of
        # whatever `frequency` gives you. Default on (pure win).
        cache_true: true

    # Sinkhorn-regularized optimal-transport divergence between
    # predicted and true cell point clouds (per slice).
    #
    # The pairwise-distance MSE already in this stack averages over
    # all N² cell-pair distances — it sees "the network has roughly
    # the right distances on average" but is BLIND to which cells are
    # in the wrong places. Sinkhorn divergence (Feydy et al. 2019)
    # computes the entropic OT cost between the two clouds: it
    # explicitly matches predicted cells to true cells via an optimal
    # transport plan, then sums the residual displacement under that
    # plan. This catches the failure mode where pairwise distances
    # are right "in distribution" but individual cells are
    # mispositioned — exactly the failure mode pairwise MSE smears
    # away.
    #
    # Used here as a SECONDARY loss component, weighted small
    # (~0.1 × pairwise_distance_mse) so it acts as a regulariser
    # rather than fighting the pairwise term for dominance. Combined
    # interpretation: pairwise MSE pins the global pairwise structure,
    # Sinkhorn enforces correct cell placement WITHIN that structure.
    #
    # Implementation: thin wrapper over geomloss.SamplesLoss with
    # ``loss="sinkhorn"``, which returns the DEBIASED Sinkhorn
    # divergence S_ε(α, β) = L_ε(α, β) − ½(L_ε(α, α) + L_ε(β, β)).
    # Debiasing makes it ZERO when the clouds match (no bias from
    # the entropic regularizer) and gradient-friendly.
    #
    # Dependency: ``pip install geomloss`` (already in scgg env).
    # Auto-uses KeOps backend if installed for ~10× speedup on
    # large clouds.
    sinkhorn:
        enabled: false
        weight: 0.1       # regulariser scale; co-magnitude with pairwise MSE at ~0.1
        # blur: entropic regularisation strength of the Sinkhorn
        # iteration. Smaller = closer to exact Wasserstein but slower
        # convergence + a SHARPER backward.
        #
        # Empirical finding (2026-05-27 ablation set): blur=0.01 on
        # cortex-scale positions ([-0.5, 0.5] cube) NaN's the gradient
        # even AFTER a 200-step warmup on edm_distance_mse — i.e.,
        # the instability isn't init-related, it's intrinsic to the
        # backward of debiased Sinkhorn at ε comparable to noise in
        # the cost matrix. Log-sum-exp on individual rows underflows
        # to -Inf in the dual potential, the gradient propagates
        # Inf-Inf = NaN, and the position head's weights get poisoned
        # on the optimizer step.
        #
        # Recommended starting value: 0.1. At cortex's normalised
        # scale 0.1 ≈ typical inter-cell gap, so the Sinkhorn
        # iteration is well-conditioned and the backward is bounded.
        # If 0.1 also produces NaN, drop `debias` to False (see
        # below) — that removes 2 of the 3 OT problems and is the
        # next-cheapest fix. As a final fallback, switch to a non-
        # Sinkhorn OT loss (Chamfer is a one-liner replacement here).
        blur: 0.1
        # scaling: epsilon-annealing factor across Sinkhorn iterations.
        # 0.5 = fast / coarse; 0.99 = slow / precise. 0.9 is the
        # standard quality/speed compromise.
        scaling: 0.9
        # p: Wasserstein-p exponent. 2 = L² cost (matches our pairwise
        # MSE convention); 1 = L¹ cost (sometimes more robust to
        # outliers). Stick with 2 unless ablating.
        p: 2
        # subsample: null = use all cells per slice. With
        # backend="tensorized" (default; see below) Sinkhorn is O(N²)
        # memory — cortex's ~7500 cells per slice → ~450MB per
        # slice for the cost matrix, fine on an H100 but tight on
        # smaller GPUs. Cap to e.g. 2000 if memory-bound or if you
        # stack this with PH/kNN-rank and need the wall-clock back.
        subsample: null
        # geomloss backend.
        # - "tensorized"  — pure PyTorch O(N²). No external deps.
        #                   Works on any GPU. Default — chosen
        #                   because the KeOps-accelerated backends
        #                   ("online", "multiscale") need a working
        #                   KeOps install (LLVM toolchain + correct
        #                   CUDA version) and we hit a silent
        #                   `generic_logsumexp` import failure when
        #                   geomloss's "auto" backend tried to use
        #                   them.
        # - "auto"        — geomloss picks: "tensorized" for small N,
        #                   "online" / "multiscale" (both KeOps) for
        #                   larger N. Faster but only if KeOps is
        #                   actually loadable. Verify with
        #                   `python -c "import pykeops; pykeops.test_torch_bindings()"`
        #                   before switching to "auto".
        # - "online"      — explicit KeOps online Sinkhorn. O(N)
        #                   memory; needs KeOps.
        # - "multiscale"  — explicit KeOps multiscale Sinkhorn. O(N)
        #                   memory + multiscale clustering; needs
        #                   KeOps. Use for N ≫ 10k.
        backend: "tensorized"
        # Differentiable Procrustes (rotation + reflection) alignment
        # of pred onto true BEFORE Sinkhorn. ON by default — without
        # it, Sinkhorn measures rotation noise rather than per-cell
        # placement error, because scgg's predictions live in an
        # arbitrary frame (EDM head Procrustes-aligns to noisy x_t;
        # FM rotation/reflection augmentation perturbs the frame
        # every step). With this on, Sinkhorn becomes a true
        # rotation+translation-invariant per-cell placement signal,
        # complementary to pairwise_distance_mse (which is already
        # rotation-invariant but blind to which cell is where).
        # Closed-form Schönemann 1966 / Kabsch: R = U·V^T from
        # SVD(pred^T · true). Fully differentiable.
        procrustes_align: true
        # Scale-invariant mode: divide BOTH clouds by the truth's RMS
        # distance to centroid before Sinkhorn. Makes ``blur`` scale-
        # independent (its effective value is then in units of "RMS
        # extent of true cloud" rather than raw position units). OFF
        # by default to preserve backward-compat; turn ON if your
        # positions live at very different scales than the LUNA/MMC
        # default and you don't want to retune ``blur``.
        scale_invariant: false
        # geomloss debiasing. True → compute the SYMMETRIC Sinkhorn
        # divergence S_ε(α, β) = L_ε(α, β) − ½(L_ε(α, α) + L_ε(β, β))
        # so the loss equals zero when α = β (no entropic bias).
        # Mathematically cleaner, but the price is 3 OT problems per
        # forward (αβ, αα, ββ) and therefore 3× the NaN-backward
        # surface area. Set False to fall back to the plain biased
        # Sinkhorn (L_ε(α, β) alone) — has a non-zero floor when α=β
        # but is the standard go-to when debiased Sinkhorn NaN's at
        # small blur. Try this BEFORE giving up on Sinkhorn entirely.
        debias: true
        # Number of training steps during which this loss is computed
        # but NOT included in the autograd graph (i.e., the model is
        # not trained by it). The loss value is still logged to
        # wandb under ``train_loss/sinkhorn`` for visibility, with
        # ``train_loss/sinkhorn_weighted = 0`` and
        # ``train_loss/sinkhorn_warmup_active = 1`` during the
        # warmup window — so you can see exactly when the warmup
        # ends.
        #
        # When warmup helps: when the failure is init-related (the
        # position head outputs near-degenerate clouds at step 0,
        # which makes Sinkhorn iterations underflow). Letting
        # edm_distance_mse / pairwise_distance_mse pull positions
        # to a reasonable scale first lets the post-warmup Sinkhorn
        # be well-conditioned.
        #
        # When warmup does NOT help (empirically observed
        # 2026-05-27): when the failure is intrinsic to debiased
        # Sinkhorn's backward at small blur (e.g., blur=0.01 on
        # cortex). In that regime the loss NaN's the moment it
        # enters the graph regardless of model state — warmup
        # delays the crash but doesn't prevent it. The fix is to
        # raise ``blur`` (to ~0.1) and/or set ``debias=False``,
        # not to warm up longer.
        #
        # Default 0 = active from step 0 (the historic behaviour).
        warmup_steps: 0

    # -----------------------------------------------------------------
    # Chamfer distance — the Sinkhorn-free OT-flavoured fallback.
    # -----------------------------------------------------------------
    # For each cell in PRED, find its nearest neighbour in TRUE and
    # accumulate the squared L² distance. Then do the same in the
    # reverse direction and average. Per slice:
    #
    #   d_chamfer(P, T) = mean_p (min_t ‖p - t‖²) + mean_t (min_p ‖t - p‖²)
    #
    # Why this and not Sinkhorn
    # -------------------------
    # Sinkhorn at small blur has an unstable BACKWARD (log-sum-exp
    # underflow + SVD-of-near-degenerate-M inside Procrustes) — the
    # 2026-05-27 ablations got `train_loss/sinkhorn` ~0.015 (finite
    # forward) but NaN gradient regardless of warmup/debias/blur.
    # Chamfer has no Sinkhorn iteration and no spectral op; the
    # backward is just min-gather + cdist-backward, both of which
    # produce bounded gradients of magnitude ~2·(pred − nearest_true).
    # It's also O(N²) memory like tensorized Sinkhorn (no asymptotic
    # win), so it's a drop-in replacement performance-wise.
    #
    # Trade-off vs Sinkhorn
    # ---------------------
    # Chamfer is NOT a true OT metric — it allows many-to-one
    # matchings (multiple pred cells can match the same true cell),
    # which can produce a "mode collapse" failure: the prediction
    # collapses onto a few high-density truth regions, ignoring
    # lower-density ones. The reverse min term (each true matched to
    # nearest pred) helps but doesn't fully prevent it.
    #
    # In practice for scgg this rarely bites because (a) we have
    # SAME-cardinality clouds with cell identities preserved across
    # P and T, and (b) other losses (edm_distance_mse, pairwise_mse)
    # already constrain global structure. Chamfer just adds a fine-
    # grained per-cell placement signal.
    chamfer:
        enabled: false
        weight: 1.0       # at squared-L² scale, comparable to pairwise_distance_mse
        # squared: True = standard squared-L² Chamfer (the literature
        # default; gradient ∝ 2·(pred − nearest_true), bounded). False
        # = plain L² Chamfer (gradient has a 1/d singularity at d=0,
        # which is rare but possible — only use if you want to match
        # Sinkhorn's L¹ behaviour for ablation.)
        squared: true
        # Differentiable Procrustes (rotation + reflection) alignment
        # of pred onto true BEFORE Chamfer. Same rationale as
        # sinkhorn.procrustes_align: Chamfer is NOT rotation-invariant
        # on its own, and scgg's predictions live in an arbitrary
        # frame (EDM Procrustes-to-noisy-x_t, FM rot/refl
        # augmentation). With this on, Chamfer measures per-cell
        # placement modulo the global frame — which is the signal we
        # want.
        #
        # R is computed under torch.no_grad and detached before the
        # final pred_c @ R multiply — same fixed-structure pattern
        # as sinkhorn (see _procrustes_align_2d docstring).
        procrustes_align: true
        # Scale-invariant mode: divide both clouds by truth's RMS
        # distance to centroid before Chamfer. Use if your positions
        # live at different scales than the LUNA/MMC default and you
        # don't want to retune weight.
        scale_invariant: false
        # Optional subsampling for very large slices. Chamfer is
        # O(N²) memory (one cdist matrix per slice). Cap to 2000 if
        # memory-bound.
        subsample: null
        # Warmup window during which the loss VALUE is logged but the
        # gradient is skipped. Chamfer's backward is bounded so this
        # is almost never needed — provided for symmetry with sinkhorn
        # and so the per-component warmup machinery is consistent.
        warmup_steps: 0

    # EDM (Euclidean Distance Matrix) squared-distance MSE —
    # automatically enabled by the EDMOutputWrapper, ignored otherwise.
    #
    # MSE between the predicted squared-pairwise-distance matrix
    # (stashed on pred.edm_D by the wrapper) and the true squared-
    # distance matrix of masked_true.positions. Supervises O(N²)
    # entries per slice rather than O(N) positions, and the loss is
    # frame-invariant by construction.
    #
    # Defined here (with enabled: false) so it lives in the strict
    # config schema; the LightningModule flips ``enabled=true`` and
    # syncs ``weight`` from ``cfg.model.edm.loss_weight`` when
    # ``cfg.model.edm.enabled=true`` is set.
    edm_distance_mse:
        enabled: false
        weight: 1.0

    # v2 geometric-decoder training signal. Scale-invariant, Procrustes-
    # aligned MSE on the DECODED 2D coordinates (pred.positions = SMACOF/MDS
    # read-out) vs true positions — trains the model to emit distances that
    # embed WELL in flat 2D (targets the aligned-RSSD metric), the signal
    # neither LUNA nor fixed-MDS scgg has. Requires a grad-carrying decode:
    # model.edm.decoder=smacof + model.edm.decoder_grad=true +
    # model.edm.mds_align_train=true (else pred.positions has no gradient
    # and this is a no-op). Default off (byte-identical).
    edm_coord_mse:
        enabled: false
        weight: 1.0
        # Optional ramp: hold this loss at 0 gradient for the first N steps
        # so the model builds a sensible predicted-distance matrix (via
        # edm_distance_mse) BEFORE the coord loss backprops through the
        # SMACOF decode of an initially-garbage D. 0 = off. A few hundred
        # to a couple-thousand steps is a good stabiliser if the grad path
        # is jumpy early.
        warmup_steps: 0

    # ----------------------------------------------------------------
    # Spatially-aware EDM loss variants. All read pred.edm_D (the EDM
    # head's predicted pairwise distances) and the true positions, like
    # edm_distance_mse, but reweight/transform the supervision toward
    # LOCAL structure — the thing the per-cell Spearman metric rewards.
    # Plain edm_distance_mse weights every pair equally, so it's
    # dominated by large, uninformative far-pair distances. Enable one
    # (or combine) to test whether local-emphasis closes the
    # objective↔metric gap. All require the EDM head (no-op otherwise).
    # ----------------------------------------------------------------
    # 1. Locality-weighted distance MSE (Sammon-stress style). Weights
    #    each pair's error by a decreasing function of TRUE distance, so
    #    near pairs dominate. weight_fn=exp → w=exp(-d/sigma);
    #    weight_fn=inverse → w=1/(1+d). sigma→∞ reduces to edm_distance_mse.
    locality_weighted_distance:
        enabled: false
        weight: 1.0
        weight_fn: exp        # exp | inverse
        sigma: 1.0            # length scale for the exp weighting
        warmup_steps: 0
    # 2. log-distance MSE — MSE on log(1+d), equalising near/far scale.
    log_distance_mse:
        enabled: false
        weight: 1.0
        warmup_steps: 0
    # 3. Differentiable per-cell Spearman surrogate — directly optimises
    #    the eval metric. Soft-ranks each cell's distance row (pairwise
    #    sigmoid, temperature `temperature`) and maximises predicted↔true
    #    rank correlation. O(S³); subsamples n_sample cells per slice.
    rank_spearman:
        enabled: false
        weight: 1.0
        temperature: 0.3      # soft-rank sharpness (smaller = harder ranks)
        n_sample: 256         # cells subsampled per slice (cost control)
        warmup_steps: 0
    # 4. kNN neighbourhood-preservation (SNE/InfoNCE). Each cell's TRUE
    #    k-NN should be its PREDICTED near neighbours; maximises the
    #    log-prob mass a t-SNE-style predicted-neighbour distribution
    #    puts on the true k-NN. Lifts local fidelity / contact-F1.
    knn_neighborhood:
        enabled: false
        weight: 1.0
        k: 10                 # true neighbours treated as positives
        temperature: 1.0      # t-SNE kernel temperature on predicted dist²
        n_sample: 256         # anchor cells subsampled per slice
        warmup_steps: 0

    # Sparse local-neighbourhood distance loss — the O(N*k) sibling of
    # locality_weighted_distance. Reads pred.edm_h (the (N,k) embedding),
    # NOT pred.edm_D, so it never builds the full (N,N) matrix: for each
    # cell it matches predicted vs true Euclidean distance on its true
    # k-NN (local fidelity) plus n_random random pairs (a cheap global
    # skeleton against the crowding problem). Pair with
    # ``model.edm.skip_edm_D_train=true`` (which makes the head ALSO skip
    # its (N,N) D_sq at train time) to get a fully sub-quadratic training
    # step — the scalable counterpart of the dense locality loss.
    #
    # ``local_k`` defaults to 32 to ALIGN with geomattn_localglobal's
    # ``n_local``: the model is supervised on the same local
    # neighbourhood it attends to. The true k-NN never changes across
    # epochs, so it is cached per slice (``cache_true``).
    sparse_local_distance:
        enabled: false
        weight: 1.0
        local_k: 32           # true-kNN neighbours supervised per cell
        n_random: 8           # random far pairs per cell (0 = pure local)
        global_weight: 0.1    # weight of the random-pair (global) term
        weight_fn: none       # none | exp | inverse (local-pair reweighting)
        sigma: 1.0            # exp(-d_true/sigma) when weight_fn=exp
        knn_chunk: 1024       # query-axis chunk for the true-kNN top-k (brute)
        cache_true: true      # cache true k-NN per slice (constant target)
        # Neighbour-search backend for the true k-NN build.
        #   brute  : chunked cdist+topk, O(N^2) compute (default; fine to ~CNS).
        #   kdtree : scipy cKDTree, O(N log N), EXACT same neighbours — the
        #            de-quadratified path for N >> 1e5 (falls back to brute
        #            with a warning if scipy is missing).
        knn_backend: brute
        # Anchor subsampling: 0 = all cells are loss anchors each step
        # (exact, default). >0 = random subset of this many anchors per
        # step (neighbours/partners still from the full slice) — bounds
        # per-step memory/compute at N ~ 1e6. Unnecessary at CNS scale.
        n_sample: 0
        # Structured global anchor (same idea as geomattn_localglobal's M
        # landmarks). Supervises each cell's distance to M SHARED,
        # spatially-spread landmark cells -> a consistent global frame,
        # the less-noisy counterpart of n_random. O(N*M). 0 = off.
        n_landmarks: 0        # number of global landmark cells (0 = off)
        landmark_weight: 0.1  # weight of the landmark (global frame) term
        landmark_mode: fps    # fps (farthest-point, spread) | random (shared subset)
        # Intrinsic-geometry target for the landmark term.
        #   euclidean (default): straight-line distance to each landmark
        #             (byte-identical to prior runs).
        #   geodesic : shortest-path distance along the cells' kNN manifold
        #             graph (Isomap target). The gauge-invariant intrinsic
        #             metric — follows the tissue sheet instead of cutting
        #             across concavities/gaps, so the global structure
        #             transfers across slices with different morphology.
        #             Computed on the TRUE positions (no grad), cached per
        #             slice. Expected to help most on non-convex slices
        #             (folds, ventricles, C-shapes); ~no-op on convex slabs.
        landmark_metric: euclidean
        geo_k: 15             # kNN graph connectivity for the geodesic graph
        # Local-vs-global balancing.
        #   none  : local + global at the manual weights above (default).
        #   equal : auto-rescale the global group each step so local and
        #           global contribute EQUALLY in value (removes the
        #           near-vs-far magnitude mismatch; global_weight /
        #           landmark_weight then only set the random-vs-landmark
        #           split within the global group).
        balance: none
        warmup_steps: 0

    # Anisotropic shape-matching loss. Supervises the COVARIANCE
    # eigenvalues of the predicted point cloud against the true
    # cloud's, per slice. Captures the "wide-x narrow-y" shape signal
    # that pairwise-distance MSE doesn't directly enforce — pairwise
    # MSE averages over all N² pairs and is dominated by the bulk
    # distribution, so a model that gets the bulk right but produces
    # an over-isotropic bounding box still scores low pairwise loss.
    #
    # Why eigenvalues and not the full 2×2 covariance: eigenvalues
    # are rotation-invariant. After Procrustes alignment (in the EDM
    # head and the FM trajectory) the prediction is in some frame
    # determined by the noisy x_t; comparing covariance entries
    # directly would be sensitive to that arbitrary rotation. The
    # eigenvalues are the variances along the two principal axes
    # regardless of which orientation the prediction settled on.
    #
    # Defaults OFF. When enabled, use a small weight (0.05-0.2) as
    # an auxiliary signal on top of pairwise_distance_mse /
    # edm_distance_mse; high weights will pull the model toward
    # matching the moments at the expense of the per-cell structure.
    #
    # ``variant`` selects which scalar(s) of the covariance the loss
    # matches. The three variants address different failure modes
    # that all manifest as "shape_matching loss → 0 but visuals
    # still look isotropic":
    #
    #   * "eigvals"  (default, original behaviour):
    #     MSE on the sorted eigenvalues (λ_min, λ_max) of the cov
    #     matrix. Fails under SCALE COLLAPSE — if the model predicts
    #     a smaller overall point cloud than the truth, both
    #     eigenvalues shrink toward zero and the absolute MSE drops
    #     without producing anisotropy.
    #
    #   * "ratio"    (scale-invariant):
    #     MSE between λ_min/λ_max(pred) and λ_min/λ_max(true). A
    #     pure anisotropy-ratio signal — penalises "predicted cloud
    #     is more circular than true cloud" regardless of overall
    #     scale. Most useful when scale collapse is suspected (which
    #     it usually is when the pairwise_distance loss is also
    #     active — pairwise already handles scale).
    #
    #   * "covariance" (full 2x2 Frobenius):
    #     ‖cov(pred) - cov(true)‖_F². Captures both eigenvalues AND
    #     the orientation of the principal axes (i.e. the off-
    #     diagonal entries). Rotation-SENSITIVE: this fights the
    #     EDM head's Procrustes alignment unless the prediction has
    #     settled into a stable frame. Use as a follow-up after
    #     "ratio" if you confirm the model now matches the
    #     anisotropy magnitude but rotates it incorrectly.
    #
    # The per-slice (λ_min, λ_max, ratio) values for both the
    # prediction and the truth are always logged to wandb when the
    # loss is enabled — they appear under ``val_shape/...`` /
    # ``train_shape/...`` keys for diagnostic purposes regardless
    # of which ``variant`` is used.
    shape_matching:
        enabled: false
        weight: 0.1
        variant: eigvals  # one of: eigvals | ratio | covariance
        # Number of training steps to wait before this loss starts
        # contributing to the gradient. See sinkhorn.warmup_steps
        # above for the contract — value is still logged during
        # warmup, ``shape_matching_warmup_active`` flag indicates
        # the active window. Useful when combined with EDM
        # mds_align_gradient=true: at init, pred.positions ≈ 0 so
        # the eigvalsh-of-covariance backward hits a degenerate
        # regime; a small warmup (say 100-300 steps) lets pairwise
        # MSE pull the position output to a non-degenerate scale
        # first. Default 0 = active from step 0.
        warmup_steps: 0

    # Latent-diffusion losses. Always "enabled" in the loss registry
    # but no-op (graph-attached zero) when the LDM stashes aren't on
    # the pred — i.e. for non-LDM runs the components contribute
    # nothing. The ``weight`` knobs here scale the LDM losses RELATIVE
    # to the position-side reconstruction loss (typically
    # pairwise_distance_mse).
    #
    # latent_fm_mse: denoiser objective. MSE between the denoiser's
    # predicted clean z_0 and the encoder's sampled z_0_target. This
    # is the FM denoising loss in latent space — directly analogous
    # to position-space x_0 prediction in vanilla FM.
    #
    # latent_kl: KL(q(z|x) || N(0,I)) on the encoder's mu/logvar.
    # Pulls the encoder's outputs toward the standard Gaussian prior
    # so the diffusion model sees a well-conditioned distribution at
    # all noise levels. Weight defaults to 1e-3 — KL terms in VAEs
    # are usually small relative to the reconstruction; bump if you
    # see "posterior collapse" (encoder ignores positions, z ≡ 0).
    latent_fm_mse:
        weight: 1.0
    latent_kl:
        weight: 0.001

    # k-NN graph contrastive BCE — automatically enabled by the
    # KNNGraphOutputWrapper, ignored otherwise.
    #
    # For each cell: positives = top-k spatial nearest neighbours
    # under TRUE positions; negatives = sampled non-positives.
    # Binary-cross-entropy on the predicted edge logits (stashed on
    # pred.knn_logits by the wrapper). Defined here so the strict
    # OmegaConf schema accepts the runtime ``enabled=true`` flip.
    knn_graph_loss:
        enabled: false
        weight: 1.0
        k: 10
        n_negatives: 20

    # Coarse-cluster centroid MSE — automatically enabled by the
    # coarse-to-fine wrapper, ignored otherwise.
    #
    # The CoarseToFineWrapper k-means-clusters cells by gene
    # expression and predicts each cluster's spatial centroid. This
    # loss term compares the predicted centroids against the true
    # centroids (computed by averaging the TRUE cell positions within
    # each cluster). It's automatically wired to the wrapper's coarse
    # output via the LossFunction registry (the wrapper stashes the
    # predicted centroids + cluster IDs on the returned DataHolder).
    #
    # Weight: 1.0 by default — same scale as the pairwise-distance
    # MSE because centroid distances and pairwise distances live in
    # the same coordinate scale. Lower this if the coarse signal
    # dominates training; raise if cell-level loss is overwhelming
    # the global signal.
    coarse_centroid_mse:
        enabled: false   # CoarseToFineWrapper construction flips this on automatically
        weight: 1.0

# ---------------------------------------------------------------------------
# EGNN backbone hyperparameters. Only consulted when `backbone: "egnn"`.
#
# Equivariant message-passing on a per-step kNN graph (positions
# determine the graph, but the graph is rebuilt each forward pass so
# it always reflects current geometry). The kNN cap keeps memory
# linear in `n_cells × knn_k` instead of quadratic in `n_cells`,
# which matters once you scale past cortex slices.
#
# Defaults are chosen so a single EGNN layer is roughly memory-
# comparable to one LUNA transformer layer on cortex
# (B=6, N≈7500, edge_dim=64, knn_k=50 → ~300 MB / layer).
# ---------------------------------------------------------------------------
egnn:
    node_dim: 256   # scalar per-cell feature width. Match LUNA's dx by default.
    edge_dim: 64    # edge-message MLP hidden width. Smaller = less memory.
    time_dim: 32    # diffusion-time embedding width fed into edge messages.
    knn_k: 50       # message-passing neighbours per cell. 50 ≈ tissue-locally meaningful.
    update_coords: true   # if false, EGNN updates h only; positions stay frozen
                          # (useful for ablation: does the equivariant graph just
                          # need to denoise features, not coords?). Default true.
# ---------------------------------------------------------------------------
# Multi-scale hierarchical wrapper. Only consulted when
# `hierarchical.enabled = true`. Currently supported with
# `backbone: "luna_transformer"` only — EGNN+hierarchical isn't wired
# yet (the equivariance bookkeeping doesn't compose trivially).
#
# Motivation
# ----------
# The cortex prediction picture showed the LUNA transformer learning
# the global tissue density (cells in a rough cortex-shaped blob) but
# failing at INTERNAL structure (laminar layers absent, cell types
# spatially intermixed where the ground truth has sharp bands).
# Linear attention is technically global, but the softmax-free
# averaging in LUNA's attention smears tissue-level signal across all
# cells uniformly — no cell has an explicit summary of "where it sits
# in the global organ."
#
# This wrapper makes that summary explicit:
#   1. Per forward, bin cells into n_patches_per_axis² spatial patches
#      via quantile binning of the CURRENT positions x_t (no info
#      leak — true positions never enter this assignment).
#   2. Aggregate cells in each patch: mean of gene embeddings +
#      patch centroid + log(cell count).
#   3. Run a small transformer OVER patches (16-64 tokens) to mix
#      tissue-level context across the slice.
#   4. Broadcast each patch's output back to its member cells.
#   5. Concatenate the broadcast vector to each cell's gene-expression
#      features as additional input to the main backbone.
#
# Properties
# ----------
# * The patch transformer is small (~16 patches × 128 hidden × 2
#   layers ≈ 200 KB), so the parameter cost is trivial.
# * The patch assignment is recomputed every forward pass from the
#   CURRENT x_t. During sampling, as x_t evolves toward x_0, the
#   patch geometry sharpens accordingly — a built-in
#   coarse-to-fine refinement that mirrors how the diffusion / FM
#   trajectory itself works.
# * Translation-invariance is preserved: patch centroids are
#   measured relative to the LUNA-mean-centered position frame, so
#   the patch features only depend on relative geometry.
# * Rotation-equivariance is NOT preserved (the patch_transformer
#   processes 2D centroids as raw scalars). That's fine for the
#   LUNA-transformer backbone (also not rotation-equivariant). When
#   we wire EGNN+hierarchical, the centroid features will need an
#   invariant reformulation (e.g. ‖centroid‖ + relative angle to
#   nearest neighbour).
#
# Off by default — flip on with:
#     --override model.hierarchical.enabled=true
# ---------------------------------------------------------------------------
hierarchical:
    enabled: false
    # Number of patches along each axis. Total patches = n_patches_per_axis².
    # 4 → 16 patches (good default for cortex, captures laminar
    # structure with a few patches per layer). 6 → 36 (finer; useful
    # if cortex is the bottleneck and laminar bands need sharper
    # resolution).
    n_patches_per_axis: 4
    # Hidden dim of the patch-level transformer. Smaller than the
    # cell-level transformer because there are only 16-64 tokens.
    patch_hidden_dim: 128
    # Number of patch-level transformer layers.
    patch_n_layers: 2
    # Number of patch-level attention heads.
    patch_n_heads: 4
    # Dim of the per-cell patch context vector that gets concatenated
    # to the cell's gene-expression features at the input to the main
    # backbone. Smaller = lighter conditioning, larger = more dominant
    # signal. 64 is a reasonable middle ground given that LUNA's
    # gene-expression input is typically O(2000)-dim raw, so 64 is
    # 3% of the input width and unlikely to drown out gene signal.
    output_dim: 64

# ---------------------------------------------------------------------------
# Coarse-to-fine factorisation of the cell-position prediction.
#
# Toggleable via `coarse_to_fine.enabled = true`. Currently supported
# with `backbone: "luna_transformer"` only (same constraint as the
# hierarchical wrapper).
#
# Motivation
# ----------
# The single-stage FM has to learn a single mapping from
# (gene_expression, noisy_position) → clean_position. That mapping
# bundles two very different jobs: getting the GLOBAL tissue layout
# right ("Layer 2/3 IT neurons go in the upper laminar band") and
# getting the LOCAL placement right ("this cell is to the left of
# that one within Layer 2/3"). These have different statistics —
# the global one is data-determined by cell-type composition, the
# local one is data-determined by tissue micro-structure.
#
# Coarse-to-fine factorisation handles them separately:
#
#   stage 1 (coarse, regression):
#     • cluster cells by gene expression via k-means (K = n_clusters);
#     • aggregate per-cluster gene features;
#     • a small transformer over the K cluster tokens regresses each
#       cluster's spatial CENTROID directly. No FM trajectory — the
#       coarse stage only has K~16 points to predict, regression is
#       well-matched.
#
#   stage 2 (fine, FM):
#     • each cell is conditioned on its cluster's predicted centroid
#       (concat to the cell's gene-expression features) before being
#       fed to the existing cell-level FM machinery.
#     • At TRAINING time, conditioning uses TRUE cluster centroids
#       (teacher forcing — avoids error compounding while the coarse
#       stage is still learning).
#     • At INFERENCE time, conditioning uses PREDICTED centroids
#       (the coarse regressor runs once per sampling-loop forward,
#       which is cheap because it operates only on K cluster tokens).
#
# Loss: cell-level pairwise-MSE (existing) + coarse-centroid MSE
# (the new component, added to model.loss as `coarse_centroid_mse`).
# Weight the two so the coarse signal regularises but doesn't
# dominate.
#
# Combines naturally with the hierarchical wrapper: hierarchical is
# SPATIAL multi-scale (bins by current x_t positions), coarse-to-fine
# is GENE multi-scale (clusters by gene expression). Two complementary
# axes of multi-scale processing. Off by default; turn on with:
#     --override model.coarse_to_fine.enabled=true
# ---------------------------------------------------------------------------
coarse_to_fine:
    enabled: false
    # Number of gene-clusters per slice. K=16 matches the hierarchical
    # default (4×4 spatial patches), which makes the two wrappers
    # behaviourally comparable. Cortex has ~6 cell-type laminar layers
    # so 16 is finer than the biological clusters; that's intentional
    # — we want coarse units smaller than the dominant cell types so
    # the regression has something to learn.
    n_clusters: 16
    # Number of k-means iterations per forward pass. 10 is more than
    # enough for K=16 — convergence is usually <5 iters.
    # Only consulted when ``cluster_mode == "kmeans"``.
    kmeans_n_iters: 10
    # Cluster assignment method.
    # - "kmeans" — hard k-means on the projected gene embeddings,
    #              recomputed per forward. Non-differentiable; gradients
    #              flow into ``gene_proj`` only through the per-cluster
    #              aggregation, not the cluster boundary itself.
    # - "gumbel" — a learnable ``cluster_head`` predicts soft logits per
    #              cell, then Gumbel-softmax with ``hard=True`` produces
    #              a one-hot assignment (matches k-means semantics for
    #              downstream code) BUT the straight-through estimator
    #              routes gradients through the soft weights back into
    #              the cluster head + ``gene_proj``. The result is that
    #              cluster boundaries co-adapt with the downstream
    #              spatial-prediction loss instead of being fixed by
    #              gene-space K-means.
    #
    # Default kmeans for byte-equivalence with prior runs. Turn on
    # gumbel via ``--override model.coarse_to_fine.cluster_mode=gumbel``.
    cluster_mode: "kmeans"
    # Gumbel-softmax temperature. Only consulted when
    # ``cluster_mode == "gumbel"``. Lower = more peaked / decisive
    # logits but harder optimisation; higher = smoother gradient
    # signal. 1.0 is the canonical Gumbel-softmax default.
    gumbel_tau: 1.0
    # Gumbel-softmax temperature annealing. When > 0, the tau decays
    # linearly from ``gumbel_tau`` (initial) to ``gumbel_tau_final``
    # over this many forward passes during training. Forces clusters
    # to sharpen as training progresses (soft early to explore, hard
    # late to commit). Standard Gumbel-softmax practice. 0 = no
    # annealing (constant tau). For cortex's ~1000 training steps,
    # 500-800 is a reasonable annealing window.
    gumbel_anneal_steps: 0
    # Final Gumbel-softmax temperature after annealing completes.
    # Only consulted when ``gumbel_anneal_steps > 0``.
    gumbel_tau_final: 0.1
    # Cluster balance regularizer weight. When > 0, adds a loss term
    # that encourages uniform cluster usage (entropy maximisation on
    # the AVERAGE cluster assignment distribution across cells in a
    # batch). Without this, Gumbel can collapse to "all cells in one
    # cluster" — a known failure mode. The reg term is small relative
    # to the main loss; 0.01 is a reasonable starting point. Set to 0
    # to disable. Only meaningful in ``cluster_mode='gumbel'`` because
    # k-means already balances clusters by construction.
    cluster_balance_weight: 0.0

    # How the inner backbone consumes cluster conditioning.
    # - "concat" (default, backward-compatible). Each cell gets its
    #   argmax cluster's [centroid_2, embedding_128] vector
    #   concatenated to its gene features. Static one-hot view of
    #   cluster membership.
    # - "cross_attention". Each cell uses its (projected) gene
    #   features as a Query against the K cluster tokens as
    #   Key/Value. Output is a single per-cell vector that's a
    #   soft mixture over relevant clusters. Lets boundary cells
    #   attend to multiple nearby clusters. Compounds with Gumbel
    #   clustering — both are about soft, learnable cluster
    #   structure.
    conditioning_mode: "concat"
    # Cross-attention block hidden width. Only consulted when
    # conditioning_mode='cross_attention'.
    cross_attn_hidden_dim: 128
    # Number of attention heads in the cell→cluster cross-attention.
    cross_attn_n_heads: 4
    # Width of the per-cell vector that the cross-attention block
    # produces and concatenates to gene features. Smaller = lighter
    # conditioning, larger = more dominant signal. 128 mirrors the
    # concat path's effective conditioning width (2 + 128 = 130).
    cross_attn_output_dim: 128

    # Multi-resolution clustering: add a SECOND parallel cluster_module
    # + coarse_regressor at a different K, providing both COARSE and
    # FINE gene-similarity grouping. Each cell receives conditioning
    # from BOTH resolutions, and the auxiliary centroid MSE covers
    # both centroid sets.
    #
    # Risk: when we tried stacking hierarchical + c2f the result was
    # WORSE than c2f alone on cortex (multi-scale axes seemed to
    # overfit on the 6-slice dataset). This option tests whether
    # multi-scale WITHIN c2f (just different K's) behaves differently.
    # Off by default.
    multi_resolution_enabled: false
    # K for the secondary (typically finer) resolution. 64 gives ~4×
    # the granularity of K=16. The primary K is ``n_clusters`` above.
    multi_resolution_k: 64
    # Weight of the secondary-resolution centroid-MSE loss term,
    # relative to the primary centroid MSE.
    multi_resolution_loss_weight: 0.5

    # Coarse-stage architecture.
    # - "regression" (default). One-shot transformer head over the K
    #   cluster tokens predicts each cluster's centroid. Loss is MSE
    #   on those predictions. Matches everything documented above.
    # - "flow_matching". A FULL FM on cluster centroids: the coarse
    #   model is repeatedly called with noisy centroids at random t
    #   during training (FM loss on velocity / x0); at inference the
    #   coarse stage runs an internal ODE (e.g. 25 Euler steps) BEFORE
    #   the cell-level FM sampling loop, and the cell-level ODE then
    #   conditions on the coarse stage's converged centroids.
    #   ``coarse_stage_n_steps`` controls the inner ODE step count.
    coarse_stage: "regression"
    coarse_stage_n_steps: 25
    # Hidden width of the coarse regressor's transformer.
    coarse_hidden_dim: 128
    # Coarse regressor depth (transformer encoder layers).
    coarse_n_layers: 2
    # Attention heads for the coarse regressor.
    coarse_n_heads: 4
    # Pre-projection of raw gene expression for both clustering AND
    # coarse-stage features. Smaller = lighter, larger = more
    # expressive cluster aggregation.
    gene_proj_dim: 128

# ---------------------------------------------------------------------------
# Auxiliary gene-reconstruction multi-task. At each train step, a
# fraction of each cell's gene values are masked (zeroed in the
# input). An auxiliary head decodes the masked values from the
# inner backbone's output representation. Multi-task SSL — novel
# for spatial coordinate prediction.
#
# Lives under cfg.model (not cfg.train) because the head module is
# part of the LightningModule's parameter set, so the checkpoint
# saves/loads it. cfg.train.* doesn't survive the inference-side
# config restore; cfg.model.* does.
# ---------------------------------------------------------------------------
gene_reconstruction:
    enabled: false
    # Fraction of gene VALUES to mask per cell per training step
    # (Bernoulli per gene element). 0.15 matches BERT.
    mask_ratio: 0.15
    # Weight of the reconstruction loss in the total objective.
    weight: 0.05
    # Hidden width of the reconstruction head MLP.
    hidden_dim: 256

# ---------------------------------------------------------------------------
# scGG fundamental method #1: EDM (Euclidean Distance Matrix) output head.
#
# Paradigm shift away from "predict 2D coordinates" toward "predict the
# N×N pairwise-distance matrix; recover coordinates by MDS." Rather
# than the network learning a frame-specific 2D layout (and depending
# on data augmentation / pairwise-distance loss to fake rotation
# invariance), we predict a relational object that's rigid-motion
# invariant by construction.
#
# Mechanism
# ---------
# When ``enabled``, an ``EDMOutputWrapper`` is bolted on top of the
# inner backbone (LUNA transformer / EGNN / etc.). At each forward:
#   1. Inner backbone runs as usual, producing per-cell features.
#   2. A learnable projector maps those features to ``embed_dim``-dim
#      per-cell embeddings h_i ∈ R^k.
#   3. Pairwise distance matrix D_ij = ‖h_i - h_j‖² is computed — this
#      lies on the Euclidean Distance Matrix manifold by construction.
#   4. At INFERENCE (and optionally training): D is projected back to
#      2D via classical MDS (double-centred eigendecomposition); the
#      resulting positions REPLACE ``pred.positions``. Procrustes-
#      aligned to the current x_t frame so the FM/DDPM trajectory
#      stays consistent across steps.
#   5. The predicted D is stashed on pred.edm_D for the new
#      ``edm_distance_mse`` loss component (auto-wired when this flag
#      is on — supervises the FULL N² entries instead of pred.positions).
#
# Why this is fundamentally different from LUNA
# ----------------------------------------------
# - Output is a relational object (D), not a frame-specific tensor (X).
# - Supervision signal: O(N²) entries per slice (every cell pair),
#   not O(N) (every cell). For cortex with ~7k cells per slice this
#   is roughly 50M supervised quantities per slice vs 14k.
# - Rotation/reflection/translation invariance hold by construction.
# - The embedding can be k > 2 (richer relational space), with MDS
#   selecting the leading 2D projection.
#
# Compose with any framework (diffusion / flow_matching / regression).
# Most natural pairing is regression (one-shot EDM prediction) for
# the cleanest paradigm shift. Combinable with c2f/hierarchical/etc.
# Defaults OFF for byte-equivalence.
# ---------------------------------------------------------------------------
edm:
    # DEFAULT FLIPPED 2026-05-25 from false to true. EDM (predict the
    # pairwise distance matrix via per-cell relational embeddings, MDS
    # to recover 2D positions) was the best-performing fundamental
    # method change in the cortex ablation sweep — see scgg_mmc_edm_fm
    # series. It composes naturally with flow_matching (the new default
    # framework above) and with EMA 0.95 (the new default in
    # configs/train/default.yaml). Pass ``--override
    # model.edm.enabled=false`` to disable EDM and run plain LUNA-
    # transformer position prediction.
    enabled: true
    # Per-cell embedding dimension k for h_i ∈ R^k. Higher k = richer
    # relational manifold; MDS extracts the leading 2 PCs at inference
    # so the wrapper still emits 2D positions. 8 is a reasonable
    # default (4× the target dim — enough slack for the embedding to
    # capture non-trivial relational structure).
    embed_dim: 8
    # Loss weight on the new edm_distance_mse component (D-MSE on the
    # predicted pairwise-distance matrix). Defaults co-magnitude with
    # the original pairwise_distance_mse so the two are roughly
    # co-equal in scale. Note: edm_distance_mse compares SQUARED
    # distances D, not Euclidean distances — units differ from
    # pairwise_distance_mse, so this weight isn't directly comparable.
    loss_weight: 1.0
    # If true, the original ``pairwise_distance_mse`` component is
    # automatically DISABLED when EDM is on — the edm_distance_mse
    # serves as its replacement (both supervise pairwise distances).
    # If false, both losses run in parallel.
    replace_position_loss: true
    # If true, the wrapper performs MDS on D and overwrites
    # ``pred.positions`` with the canonical 2D layout (Procrustes-
    # aligned to the current x_t frame). If false, pred.positions
    # stays as the inner backbone's raw output (the EDM head then
    # acts as a pure auxiliary loss). Default true: the canonical
    # frame is the whole point.
    mds_align: true
    # When ``mds_align: true``, the MDS-aligned ``pred.positions``
    # are by default produced under ``torch.no_grad()`` (so the
    # backward graph can't poison itself through ``torch.linalg.eigh``'s
    # 1/(λ_i - λ_j) backward singularity at near-degenerate
    # eigenvalues). The defensive detach has a SILENT cost:
    # auxiliary losses computed on ``pred.positions`` (sinkhorn,
    # shape_matching, pairwise_distance_mse-on-positions) have
    # zero gradient w.r.t. the model weights through this path —
    # their loss values move because ``D_sq`` improves under
    # edm_distance_mse, but they contribute nothing to training.
    # Set ``mds_align_gradient: true`` to RESTORE gradient flow.
    # A NaN-guard backward hook is installed on the MDS output so
    # any near-degenerate slice at most loses its own gradient
    # contribution rather than poisoning the entire backward graph.
    # This is the difference between "wandb shows the auxiliary
    # loss going down" (the legacy false path: it goes down but
    # doesn't train) and "the auxiliary loss actually trains the
    # model toward what it measures" (true). Default false
    # preserves the legacy behaviour for existing checkpoints;
    # turn on for any run that combines EDM with a non-EDM
    # auxiliary loss.
    mds_align_gradient: false
    # ---- Skip MDS during training (speed optimisation) ----
    # MDS (eigh on N×N matrix) is O(N³) — for cortex N≈6k it's
    # ~200ms/step; for CNS N≈46k it's multiple seconds/step. When the
    # only active loss is ``edm_distance_mse`` (which reads
    # ``pred.edm_D`` directly, not ``pred.positions``), the MDS step
    # is pure overhead during training. Setting this to False skips
    # MDS in train mode but ALWAYS runs it at inference (eval mode)
    # so pred.positions remains the canonical layout for metrics /
    # plots / per-slice CSV outputs.
    #
    # When to keep True (default): any loss reads pred.positions —
    # sinkhorn, chamfer, shape_matching, knn_rank, persistent_homology,
    # or pairwise_distance_mse left enabled. Skipping MDS would
    # silently break those (pred.positions = backbone's raw output,
    # not the MDS-aligned canonical frame).
    #
    # When safe to set False: EDM-only runs (typical scgg-on-MMC
    # default). The wrapper-config auto-disable already turned off
    # ``pairwise_distance_mse`` for you; no other position-side
    # losses are on by default. Expected speedup: 2-5× on MMC,
    # 5-15× on CNS.
    mds_align_train: true
    # ---- MDS solver precision (efficiency knob A) ----
    # "fp64" (default) — promote the per-slice D_v to float64 before
    # eigh. Required when ``mds_align_gradient=true`` because eigh's
    # backward formula needs fp64 precision to keep 1/(λ_i − λ_j)
    # finite at near-degenerate spectra (the 2026-05-27 NaN fix).
    # "fp32" — skip the fp64 cast. ~2× faster on the eigh step.
    # SAFE only when no backward goes through eigh —
    # ``mds_align_gradient=false`` AND/OR ``mds_align_train=false``.
    # The wrapper fail-loud-raises if you combine fp32 with
    # mds_align_gradient=true.
    mds_dtype: "fp64"
    # ---- MDS solver algorithm (efficiency knob B) ----
    # "eigh" (default) — torch.linalg.eigh, computes ALL N eigenpairs
    # (O(N³)). Has a stable autograd backward.
    # "lobpcg" — torch.lobpcg with k=2, computes only the top-2
    # eigenpairs we actually need (O(N²·iter)). 10-20× faster at
    # N≈46k. No stable autograd backward — gated to
    # ``mds_align_gradient=false``. The wrapper fail-loud-raises
    # otherwise.
    mds_solver: "eigh"
    # ---- Sparse-training: skip the full (N,N) D_sq at train time ----
    # When true, the EDM head does NOT materialise the (B,N,N) squared
    # distance matrix during TRAINING — it only emits pred.edm_h (the
    # small (N,k) embedding). This is the enabler for the O(N*k)
    # ``model.loss.sparse_local_distance`` loss (which reads edm_h, not
    # edm_D). The head's D_sq is otherwise the last remaining O(N²) term
    # in a training step once the backbone is sub-quadratic, so skipping
    # it is what makes training end-to-end sub-quadratic. The FM Euler
    # step reads edm_h (not edm_D) so the generative path is unaffected;
    # at INFERENCE (eval mode) the full D_sq + MDS always run so
    # pred.positions stays the canonical layout for metrics/plots.
    # GUARD (enforced in diffusion_model.py): requires
    # ``model.edm.loss_weight=0`` (edm_distance_mse off), the dense
    # edm_D-reading losses off, and sparse_local_distance.enabled=true —
    # otherwise those terms would silently become no-ops.
    skip_edm_D_train: false
    # ---- Surgical fp32 island for the geometry head ----
    # When true (default), the projector -> pairwise-distance -> MDS path
    # runs in fp32 even under train.precision=bf16-mixed, while the
    # backbone keeps its bf16 speed. bf16's ~3 significant digits coarsen
    # predicted distances and scramble the fine neighbour orderings the
    # per-cell Spearman metric measures (a global-bf16 run regressed
    # badly), so the distance math stays fp32. No-op under pure fp32
    # (the disabled-autocast context does nothing when autocast is off),
    # so existing runs are unaffected. Set false to let the head follow
    # the ambient precision (i.e. full bf16) — only for A/B diagnosis.
    fp32_geometry: true
    # ---- Geometric decoder (D_sq -> 2D read-out) ----
    # "mds"    (default): classical MDS only — top-2 eigenvectors of the
    #          double-centred distance matrix (byte-identical to prior runs).
    # "smacof": use classical MDS as a warm-start, then run ``smacof_iters``
    #          differentiable Guttman iterations that directly minimise the
    #          raw MDS stress. Beats the spectral top-2 truncation whenever
    #          the predicted distances aren't cleanly 2D-embeddable (see the
    #          SCGG_LOG_MDS_VAR top2_frac diagnostic); eigh-free backward, so
    #          it's safe to differentiate through for end-to-end geometry.
    #          Can be A/B'd on an existing checkpoint at INFERENCE (with the
    #          fastmds/detached path it only changes the read-out), or trained
    #          with mds_align_gradient=true for an end-to-end coord signal.
    decoder: "mds"
    smacof_iters: 30       # Guttman iterations when decoder='smacof'
    # v2 — train END-TO-END through the SMACOF decoder. When true (with
    # decoder='smacof' AND mds_align_train=true), the decode runs at train
    # with gradient: classical-MDS init is detached (no eigh backward), and
    # the last ``smacof_grad_iters`` Guttman steps carry gradient through the
    # predicted distances. Pair with model.loss.edm_coord_mse to give the
    # model a coordinate-space signal (learn 2D-embeddable distances).
    # Default false = decoder is inference-only (v1).
    decoder_grad: false
    smacof_grad_iters: 5   # last-k Guttman steps that carry gradient (bounds memory)
    # ---- MDS Tikhonov regularization strength ----
    # Per-eigenvalue diagonal perturbation in ``_classical_mds_2d``.
    # The Tikhonov diagonal is ``arange(n) * mds_tikhonov_eps * scale``
    # where scale = max(|B_ii|), so the MINIMUM spacing between
    # adjacent eigenvalues after the bump is ``mds_tikhonov_eps · scale``.
    # eigh's backward formula contains ``1/(λ_i − λ_j)`` for ALL n²
    # eigenpair indices (autograd's chain-rule traversal touches the
    # full Jacobian even though we only read out the top-2
    # eigenvectors), so the upper bound on these gradient
    # magnifiers is ``1 / (mds_tikhonov_eps · scale)``.
    #
    # When to bump (the 2026-05-27 diagnosis)
    # ---------------------------------------
    # With ``mds_align_gradient=false`` (legacy default): MDS-backward
    # is never exercised, so 1e-6 (minimal precision impact) is
    # correct.
    #
    # With ``mds_align_gradient=true`` AND any position-based loss
    # active (sinkhorn / chamfer / shape_matching): MDS-backward is
    # exercised. At cortex's n≈7000 the default 1e-6 gives gradient
    # magnitudes O(1e6), which overflows fp32 in chain rule. Symptom:
    # finite forward losses (bounded ~0.01-0.1) but on_after_backward
    # raises RuntimeError on NaN/Inf in some param.grad. Bump to:
    #   - 1e-4 for n in [3000, 10000]  — most spatial datasets
    #   - 1e-3 for n > 10000           — very large slices
    #
    # Precision cost: each eigenvalue receives a unique tag of size
    # `i * mds_tikhonov_eps * scale`. For the top-2 eigenvalues
    # (i = n-1, n-2) the tag is O(mds_tikhonov_eps · scale · n).
    # At 1e-4 and n=7000, that's ~0.7 · scale — a substantial
    # perturbation. But the top-2 eigenvalues themselves are O(scale·n)
    # for a well-separated layout, so the *relative* perturbation
    # is still ~mds_tikhonov_eps, i.e. ~1e-4. Acceptable.
    mds_tikhonov_eps: 1.0e-6
    # ---- Architectural extension #1 — bilinear / anisotropic gating ----
    # When true, the EDM head computes a learned Mahalanobis-style
    # distance D_ij = (h_i − h_j)^T M (h_i − h_j) with M = W^T W
    # (positive semi-definite by construction, k×k learnable). W is
    # initialised to the identity matrix so initial behaviour is
    # byte-identical to the current isotropic D = ‖h_i − h_j‖²; the
    # optimizer then deviates from identity if anisotropic weighting
    # helps.
    #
    # Why: with isotropic D, every embedding dimension contributes
    # equally to spatial distance. For cells, not every gene-derived
    # feature is equally informative about position (a neuron-type
    # marker is more spatially-relevant than a housekeeping gene).
    # Anisotropic gating lets the model express "these embedding
    # dimensions predict position, those don't" without growing the
    # embedding dimension itself.
    #
    # Cost: tiny — a single (k, k) parameter tensor. k=8 default =
    # 64 extra weights. No effect on inference latency.
    anisotropic_gating: false
    # ---- Architectural extension #4 — True EDM diffusion ----
    # When true, the FM trajectory operates in the k-D embedding
    # space (not in 2D position space): h_t = (1−t)·h_0 + t·noise
    # with h_0 the classical-MDS embedding of true positions into k
    # dimensions, and the inner Model trained to denoise h_0 from h_t
    # at each step. Final MDS at sample-end recovers 2D positions.
    #
    # Differs from the current setup (FM in 2D position space, EDM
    # head as output projection) by operating in the embedding space
    # *throughout* the trajectory rather than only at the output. The
    # "true diffusion on the EDM manifold" pitch from the May
    # ablation menu.
    #
    # Requires ``framework=flow_matching`` (we only support FM-on-h
    # for this flag, not DDPM-on-h). The mds_align step at inference
    # is still active and operates on D = ‖h_0_i − h_0_j‖²
    # at the end of the reverse trajectory.
    diffuse_in_embed_space: false

# ---------------------------------------------------------------------------
# scGG fundamental method #4: k-NN graph generation output head.
#
# Alternative output paradigm: instead of predicting absolute
# coordinates, predict the spatial k-nearest-neighbours GRAPH directly.
# Reframes the problem from "where is each cell" to "who is next to
# whom in tissue" — which is what most downstream analyses (niche
# enrichment, ligand-receptor inference) actually use.
#
# Mechanism
# ---------
# When ``enabled``, a ``KNNGraphOutputWrapper`` wraps the inner
# backbone:
#   1. Inner backbone runs as usual, producing per-cell features.
#   2. A learnable projector maps features to ``embed_dim``-dim
#      per-cell embeddings h_i ∈ R^k.
#   3. Pairwise edge logits L_ij = -‖h_i - h_j‖² (negative squared
#      distance — closer embedding → higher edge score). Symmetric
#      by construction.
#   4. Loss: contrastive BCE — for each cell, the true k spatial
#      neighbours are POSITIVES; a sample of ``n_negatives`` non-
#      neighbours are NEGATIVES. The model has to push positives'
#      logits up and negatives' down.
#   5. At INFERENCE: take top-k edges per cell to form the predicted
#      graph; recover 2D coordinates via Laplacian eigenmaps (spectral
#      embedding) for downstream visualisation / metrics. Positions
#      live on pred.positions as usual so downstream code is unchanged.
#
# Why this is fundamentally different from LUNA
# ----------------------------------------------
# - Output space: discrete graph (or a ranking) instead of continuous
#   coordinates. Naturally invariant to rigid motion AND to global
#   scale.
# - Learning target is RELATIVE ("which 10 cells are closest to me?")
#   instead of ABSOLUTE ("where am I in 2D?"). Often easier on small
#   datasets — the loss landscape is flatter.
# - Directly aligned with downstream biology: niche analysis,
#   cell-cell communication, lineage inference all consume the
#   spatial graph, not coordinates.
#
# Mutually exclusive with ``edm.enabled`` (both replace the position
# output path). Construction asserts this. Defaults OFF.
# ---------------------------------------------------------------------------
knn_graph:
    enabled: false
    # Per-cell embedding dim k for the edge-logit head.
    embed_dim: 16
    # Number of spatial nearest neighbours to recover per cell. Cortex
    # tissue density makes k=10 a reasonable neighbourhood ball.
    k: 10
    # Negatives sampled per positive edge in the contrastive loss.
    # Higher = stronger negative signal but more compute; 20 is the
    # standard contrastive-learning default.
    n_negatives: 20
    # Weight of the k-NN graph loss in the total objective.
    loss_weight: 1.0
    # Temperature for the contrastive softmax (CLIP / SimCLR style).
    # The wrapper L2-NORMALISES embeddings before computing pairwise
    # squared distance, so ‖h_i − h_j‖² is bounded in [0, 4]. The
    # raw negative-distance is then divided by ``temperature`` to
    # produce the BCE-with-logits input. Smaller = sharper logits =
    # higher-confidence predictions. 0.1 is the CLIP default and
    # what we use here.
    #
    # WITHOUT normalisation + temperature, the unconstrained contrastive
    # BCE rewards pushing negatives' embeddings infinitely far apart;
    # ‖h‖ grows unboundedly over training and the loss eventually
    # NaNs out (we hit this in the v1 of this module). The normalise+
    # temperature recipe is the standard stability fix.
    temperature: 0.1
    # If true, the original ``pairwise_distance_mse`` component is
    # auto-disabled when knn_graph is on (the graph loss replaces it).
    # If false they run in parallel.
    replace_position_loss: true
    # At inference, derive 2D coordinates via Laplacian eigenmaps on
    # the predicted graph. Required for downstream metrics that read
    # pred.positions. If false, pred.positions stays as the inner
    # backbone's raw output (useful for ablation: does the graph
    # supervision alone help the backbone's positional prediction?).
    spectral_layout: true
    # When ``spectral_layout: true``, the spectral-layout
    # ``pred.positions`` is by default produced under
    # ``torch.no_grad()`` (defends against the same eigh-degenerate
    # backward issue as edm.mds_align). Same silent-silencing
    # caveat: any auxiliary loss that operates on pred.positions
    # (shape_matching, sinkhorn, knn_rank, persistent_homology,
    # pairwise_distance_mse-on-positions) gets ZERO gradient through
    # this path. The ``LossFunction.__init__`` guard raises at
    # config-load time if this combination is detected, so it can't
    # silently happen. Set to ``true`` to restore gradient flow with
    # a NaN-guard backward hook (mirrors edm.mds_align_gradient).
    spectral_layout_gradient: false

# ---------------------------------------------------------------------------
# scGG fundamental method #3 (scaffold): SE(2)-equivariant vector-neuron
# transformer backbone.
#
# Status: CONFIG SCAFFOLD ONLY in this revision — the actual
# ``vn_transformer`` module raises NotImplementedError. Selecting
# ``backbone: "vn_transformer"`` fails fast with a clear message.
# The plan: replace each scalar feature with a (scalar, vector) pair
# and use vector-neuron primitives (VN-Linear / VN-ReLU / VN-Attention)
# whose output co-rotates with the input by construction. Drops the
# rotation-augmentation hack — equivariance holds by design.
#
# Selected via ``backbone: "vn_transformer"`` (alongside
# luna_transformer / egnn).
# ---------------------------------------------------------------------------
vn_transformer:
    # Scalar feature width (S, in Deng et al. 2021 notation).
    scalar_dim: 256
    # Number of vector channels (V). Each carries a 2D vector
    # (since spatial transcriptomics is in R^2). Output positions
    # are read off ONE of these vector channels.
    vector_dim: 32
    # Number of attention heads.
    n_heads: 8
    # Hidden width of the per-block feedforward MLP.
    ff_hidden_dim: 512

# ---------------------------------------------------------------------------
# scGG fundamental method #2 (scaffold): cell-cell potentials / energy-
# based generative framework.
#
# Status: CONFIG SCAFFOLD ONLY in this revision — the actual
# ``energy_predictor`` raises NotImplementedError on instantiation.
# Selecting ``framework: "energy"`` fails fast with a clear message.
#
# Mechanism (planned)
# -------------------
# Learn a pairwise potential Φ_θ(g_i, g_j, r_ij) → ℝ over (gene_i,
# gene_j, pairwise_distance). Total tissue energy:
#     E(x | g) = Σ_{i<j} Φ_θ(g_i, g_j, ‖x_i − x_j‖)
# Training: denoising score matching — perturb x by Gaussian noise,
# train ∇_x E to match (x_clean − x_noisy) / σ². Sampling: annealed
# Langevin dynamics from random initialisation, decreasing σ over
# multiple noise levels.
#
# Why this is fundamentally different from LUNA
# ----------------------------------------------
# - Different model class entirely: physics-informed generative model
#   vs. black-box position predictor.
# - Φ is INTERPRETABLE: ``Φ([gene_A], [gene_B], r)`` plotted against
#   r gives the learned "attraction profile" between two cell types.
#   Biological reviewers care about mechanistic insight, not just
#   benchmark numbers.
# - Generalises off-distribution by physical analogy: if A-B
#   attraction was learned, the model reasons about unseen tissues
#   with different A:B ratios automatically.
#
# Selected via ``framework: "energy"`` (alongside diffusion /
# flow_matching / regression). Off by default.
# ---------------------------------------------------------------------------
energy:
    # Hidden width of the pairwise potential MLP Φ_θ.
    phi_hidden_dim: 128
    # Number of MLP layers in Φ_θ.
    phi_n_layers: 3
    # Number of nearest gene-space neighbours each cell interacts
    # with (kNN-restricted energy). Full O(N²) pairwise is too
    # memory-heavy for slices with thousands of cells; kNN-restricted
    # is the standard tractability trick. 50 mirrors the EGNN default.
    interaction_k: 50
    # Annealed Langevin sampling: noise level schedule (decreasing).
    noise_levels: [1.0, 0.5, 0.25, 0.125, 0.0625]
    # Langevin steps per noise level.
    n_langevin_steps_per_level: 100
    # Langevin step size (η in x ← x − η·∇E + √(2η)·ξ).
    step_size: 0.01

# ---------------------------------------------------------------------------
# Architectural extension #2 — DiT-style backbone
# (Peebles & Xie 2022, "Scalable Diffusion Models with Transformers")
#
# Selected via ``backbone: "dit"`` (alongside luna_transformer / egnn /
# vn_transformer). Replaces LUNA's 3-stream attention with a standard
# transformer over per-cell tokens, plus adaLN-Zero time conditioning
# (each block learns six modulation vectors — scale/shift/gate × MSA/MLP
# — from the time embedding; gates init to 0 so each block starts as
# identity).
#
# Why it might win on top of EDM-FM: DiT is the SoTA for image
# diffusion (consistently +5-10% over U-Net baselines). adaLN-Zero is
# specifically designed for FM/diffusion time conditioning. EDM head
# composes cleanly: DiT produces per-cell features, EDM head projects
# to embedding for distance prediction.
# ---------------------------------------------------------------------------
dit:
    # Per-token hidden width. 256 matches LUNA's hidden_dims.dx so the
    # parameter budget is roughly comparable.
    hidden_dim: 256
    # Number of DiT blocks. 8 matches model.n_layers above.
    n_layers: 8
    # Attention heads. Standard DiT uses hidden_dim/64 (so 4 for 256).
    # We use 8 to match LUNA's 16-head config more closely (compromise
    # between LUNA's heavy attention and DiT's lighter).
    n_heads: 8
    # FFN expansion factor. Standard DiT uses 4x; we use 4 too.
    mlp_ratio: 4
    # Time embedding width (sinusoidal embedding dim, projected to
    # hidden_dim for adaLN-Zero conditioning).
    time_embed_dim: 256

# ---------------------------------------------------------------------------
# Geometry-Coupled Attention (GCA) backbone — methodological extension.
#
# Selected via ``backbone: "geomattn"``. Architecturally a DiT
# (adaLN-Zero, same final layer) whose self-attention carries an extra
# additive, learnable, SE(2)-invariant geometric bias over the current
# coordinate estimate x_t:
#       score_ij^h += gamma_h(t) · ( W_h · phi(||x_t,i - x_t,j||) )
# where phi is a shared Gaussian RBF expansion of the pairwise distance,
# W_h a per-head linear kernel, and gamma_h(t) a per-head time-gate
# (zero-init → identical to DiT at start of training).
#
# Why it might win on top of EDM-FM: the "right" attention pattern for
# spatial reconstruction is the spatial neighbourhood graph, but that
# graph is the unknown we're solving for. GCA bootstraps it from the
# current estimate and lets attention + geometry co-evolve along the
# sampling trajectory. The bias is exactly SE(2)-invariant (depends only
# on distances), matching the EDM head's symmetry at the output side.
# ---------------------------------------------------------------------------
geomattn:
    # Per-token hidden width (matches dit / LUNA hidden_dims.dx).
    hidden_dim: 256
    # Number of GCA blocks. 8 matches model.n_layers above.
    n_layers: 8
    # Attention heads. Each head learns its own radial kernel + gate.
    n_heads: 8
    # FFN expansion factor.
    mlp_ratio: 4
    # Time embedding width (sinusoidal → hidden_dim for adaLN + gate).
    time_embed_dim: 256
    # Number of Gaussian radial-basis functions in the shared distance
    # expansion. Larger = more expressive distance kernels, but the RBF
    # tensor is (B, N, N, num_rbf) so memory scales linearly in it.
    # 16 is a good default for MMC-scale slices; drop to 8 for very
    # large slices.
    num_rbf: 16
    # Upper end of the initial RBF centre range (centres start as
    # linspace(0, init_max_dist, num_rbf)). Should bracket the typical
    # pairwise distance scale of the (normalised) coordinates. Centres
    # and widths are learnable so this is only an initialisation.
    init_max_dist: 3.0
    # Detach the positions used to build the geometric bias (treat the
    # current geometry as a conditioning signal, not something the
    # coordinate loss backprops through — self-conditioning semantics).
    # Set False to ablate: let gradient flow through the bias too.
    detach_geometry: true
    # Gradient checkpointing: recompute each block in the backward pass
    # instead of storing its (B,H,N,N) attention + geometric bias. ON by
    # default because GCA's dense per-head bias is O(B·H·N²) and the
    # SDPA-with-float-mask path stores the N×N attention per layer for
    # backward — a deep stack on cortex-scale slices (N~10k) otherwise
    # OOMs an 80 GB GPU at the default batch size. ~30% extra compute,
    # large memory cut. NOTE: even with checkpointing, geomattn's bias
    # is fundamentally O(B·H·N²); use train.batch_size=1 for
    # cortex/CNS-scale slices.
    grad_checkpoint: true

# ---------------------------------------------------------------------------
# Geometry-Coupled Nyström Attention (geomattn_nystrom) — scalable GCA.
#
# Selected via ``backbone: "geomattn_nystrom"``. Same geometric bias as
# geomattn, but injected at the LANDMARK level so it inherits
# Nyströmformer's O(N·M) cost instead of geomattn's O(N²). Landmarks
# are segment-mean pools of cells; each landmark's centroid position is
# the segment-mean of its cells' coordinates, which gives the three
# Nyström softmax blocks (F: cell↔landmark, B: landmark↔landmark,
# G: landmark↔cell) well-defined distances to bias. Recovers dense
# geomattn at M ≥ N (the layer falls through to exact dense GCA then).
# ---------------------------------------------------------------------------
geomattn_nystrom:
    hidden_dim: 256
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    # Radial-kernel knobs (shared with geomattn semantics).
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    # Nyström knobs (shared with the nystromformer backbone semantics).
    # M — number of landmarks. The geometric bias resolves spatial
    # structure at this granularity, so larger M = finer spatial
    # coupling (and tighter Nyström approx) at O(N·M) cost.
    n_landmarks: 64
    # Schulz iterations for the Moore-Penrose pseudo-inverse of B.
    moore_penrose_iters: 6
    # If N ≤ exact_until_n (or N ≤ n_landmarks), fall through to DENSE
    # geometry-coupled softmax — the M → N exactness limit. 0 = always
    # use the Nyström path when N > n_landmarks.
    exact_until_n: 0
    # Gradient checkpointing. Off by default — Nyström is already
    # O(N·M) so the per-layer tensors are small. Turn on only for very
    # deep stacks.
    grad_checkpoint: false

# ---------------------------------------------------------------------------
# Geometry Local-Global Attention (geomattn_localglobal) — sub-quadratic
# geometry-aware attention via exact-local + landmark-global.
#
# Selected via ``backbone: "geomattn_localglobal"``. Each cell attends
# with FULL geometry-biased softmax to its top-`n_local` spatial
# neighbours (kNN under x_t, computed once per forward), and to a coarse
# `n_landmarks`-landmark summary of the far field. O(N·(n_local +
# n_landmarks)) — sub-quadratic.
# ---------------------------------------------------------------------------
geomattn_localglobal:
    hidden_dim: 256
    n_layers: 8
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    # K — exact local neighbourhood size (top-K nearest cells). Bigger =
    # more exact attention, O(N·K) cost. 32 is a good cortex default.
    n_local: 32
    # M — landmark count for the global far field.
    n_landmarks: 64
    # Combination scheme: "gated" (out = g·local + (1-g)·Nyström-global,
    # learned per-head blend) or "unified" (single softmax over
    # {K cells} ∪ {M landmarks} with per-query landmark count-exclusion;
    # exact dense softmax in the K→N limit).
    combine: "gated"
    # Schulz iterations for the Nyström pseudo-inverse (gated mode only).
    moore_penrose_iters: 6
    # Query-chunk size for the once-per-forward kNN (bounds its peak
    # memory to O(chunk·N)). Lower if the kNN step itself OOMs on huge N.
    knn_chunk: 1024
    # Neighbour-search backend for the per-forward local kNN.
    #   brute  : GPU chunked cdist+topk, O(N^2) compute (default; fastest
    #            at small/CNS N — it's a single GPU matmul).
    #   kdtree : per-slice scipy cKDTree, O(N log N) — for N >> 1e5 where
    #            the O(N^2) cdist dominates. EXACT same neighbours;
    #            indices from the tree, distances recomputed in torch
    #            (grad-aware). Runs on CPU + host transfer each forward,
    #            so only worth it at large N. Falls back to brute if
    #            scipy is missing.
    knn_backend: brute
    # Gradient checkpointing. ON by default (the local gather's
    # (B,H,N,K,D) tensor is the main activation; checkpointing keeps a
    # deep stack within memory at cortex scale).
    grad_checkpoint: true

# ---------------------------------------------------------------------------
# Spatial sparse geometry-attention zoo — five backbones, each mapping a
# famous index-based efficient-attention method to 2-D spatial proximity.
# Selected via backbone: "geomattn_{dilated,bigbird,axial,swin,routing}".
# All share the radial geometry bias + DiT scaffolding; the keys below
# are read from the matching config block. Common knobs (hidden_dim,
# n_heads, mlp_ratio, time_embed_dim, num_rbf, init_max_dist,
# detach_geometry, grad_checkpoint) mirror geomattn defaults.
# ---------------------------------------------------------------------------
geomattn_dilated:        # Sparse Transformer / dilated Longformer
    hidden_dim: 256
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    grad_checkpoint: true
    # K exact neighbours, sampled every `dilation`-th from the top
    # (n_local*dilation) nearest → spans near→far at O(N·K). dilation=1
    # reduces to plain local kNN attention.
    n_local: 32
    dilation: 3
    knn_chunk: 1024

geomattn_bigbird:        # BigBird: window + random + global
    hidden_dim: 256
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    grad_checkpoint: true
    n_local: 24            # local kNN window
    n_random: 8            # random distant cells per query (resampled / forward)
    n_landmarks: 64        # landmark global far field (count-excluded)
    knn_chunk: 1024

geomattn_axial:          # Axial: x-bands then y-bands
    hidden_dim: 256
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    grad_checkpoint: true
    # Cells per band (≈√N is the cost-optimal choice → O(N·√N)).
    band_size: 128

geomattn_swin:           # Swin: shifted spatial grid windows
    hidden_dim: 256
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    grad_checkpoint: true
    # grid × grid spatial buckets; the grid is shifted half a cell on
    # odd layers for cross-window flow.
    grid: 8
    # Max cells per window. Dense buckets are split into fixed-size
    # windows (Swin-style) so the O(G·S²) grouped-attention tensor stays
    # bounded — lower this (e.g. 128) if a slice OOMs, raise for more
    # context per window.
    max_window: 256

geomattn_routing:        # Routing Transformer: k-means spatial clusters
    hidden_dim: 256
    n_heads: 8
    mlp_ratio: 4
    time_embed_dim: 256
    num_rbf: 16
    init_max_dist: 3.0
    detach_geometry: true
    grad_checkpoint: true
    # Number of position-space k-means clusters; cells attend within
    # their cluster. kmeans_iters Lloyd steps per forward.
    n_clusters: 32
    kmeans_iters: 5
    # Max cells per cluster-window. k-means clusters can be very
    # imbalanced, so oversized clusters are split into fixed-size
    # windows to bound the O(G·S²) grouped-attention tensor.
    max_window: 256

# ---------------------------------------------------------------------------
# Architectural extension #3 — Perceiver-style backbone
# (Jaegle et al. 2021, "Perceiver IO: A General Architecture for
# Structured Inputs & Outputs")
#
# Selected via ``backbone: "perceiver"``. Drops cell-cell attention's
# O(N²) cost by routing all interactions through K << N learnable
# "anchor" tokens: cells → anchors via cross-attention (anchors absorb
# tissue context), anchors → anchors via self-attention (K² is tiny),
# anchors → cells via cross-attention (cells read back). Anchors act
# like learned global features any cell can reference.
#
# Beyond the compute saving (~100× cheaper attention for cortex's
# ~7k cells), the anchor bottleneck is implicit regularisation — the
# model has to summarise tissue context through K dimensions, which
# is exactly the "less overfitting on 6 slices" inductive bias EDM
# already provides at the output side.
# ---------------------------------------------------------------------------
perceiver:
    # Number of anchor (latent) tokens. 32 is the Perceiver-IO default
    # for moderately-sized inputs; bump to 64 if cortex-scale slices
    # are under-summarised.
    n_anchors: 32
    # Hidden width of anchor tokens.
    anchor_dim: 256
    # Hidden width of cell tokens (input/output).
    cell_dim: 256
    # Number of anchor↔anchor self-attention blocks between the
    # cells→anchors and anchors→cells cross-attention layers.
    n_anchor_blocks: 6
    # Attention heads (used for cross- and self-attention alike).
    n_heads: 8
    # FFN expansion factor in the anchor self-attention blocks.
    mlp_ratio: 4
    # Time embedding width — fed into the anchor stream via adaLN
    # (same primitive as the DiT backbone uses).
    time_embed_dim: 256

# ---------------------------------------------------------------------------
# Nyströmformer backbone (Xiong et al. 2021).
#
# Selected via ``backbone: "nystromformer"``. Sub-quadratic global
# self-attention with O(N · M) cost via the Nyström matrix
# approximation:
#
#     A ≈ F · B^+ · G            where F, G, B are softmaxed sub-
#                                 matrices computed against M
#                                 segment-mean landmarks.
#
# Key knobs:
#   * ``n_landmarks`` (M)        — sets the speed/quality trade.
#                                  Larger M tightens the approximation
#                                  (M → N gives exact softmax).
#   * ``moore_penrose_iters``    — number of Schulz iterations for B^+.
#                                  6 is the paper's default and gives
#                                  3-iteration cubic convergence below
#                                  the natural noise floor.
#   * ``exact_until_n``          — hybrid switch: if a slice has N ≤
#                                  this threshold, each layer falls
#                                  through to exact SDPA instead of
#                                  running Nyström. Same weights either
#                                  way — the layer is just smarter
#                                  about choosing the cheaper kernel.
#                                  0 = always Nyström. Set to 16000
#                                  for mixed-size datasets.
# ---------------------------------------------------------------------------
nystromformer:
    hidden_dim: 256
    n_heads: 8
    mlp_ratio: 4
    # n_layers: null → falls back to the global cfg.model.n_layers
    # (8 by default). Override per-backbone if needed.
    n_layers: 8
    time_embed_dim: 256
    # Nyström-specific:
    n_landmarks: 64
    moore_penrose_iters: 6
    # 0 = always use Nyström approximation. Set to 16000 to opt
    # into the hybrid switch (exact SDPA for small slices, Nyström
    # for large). Use this when training on mixed-size datasets
    # where some slices are small enough that N² is cheaper than
    # N·M.
    exact_until_n: 0

# ---------------------------------------------------------------------------
# Architectural extension #5 — Latent Diffusion
# (Rombach et al. 2022, "High-Resolution Image Synthesis with Latent
# Diffusion Models" — the Stable Diffusion architecture, adapted for
# scgg).
#
# Selected via ``framework: "latent_diffusion"``. Trained as a
# single-phase joint VAE + diffusion: encoder, denoiser, and decoder
# all update together under three losses:
#   * pairwise_distance_mse (or any other position-space loss already
#     enabled) — supervises the decoder's reconstruction.
#   * latent_fm_mse — supervises the denoiser's z_0 prediction
#     against the encoder's z_0 sample (FM denoising in latent space).
#   * latent_kl — pulls the encoder's q(z|x) toward N(0, I).
#
# Two-phase training (VAE pretrain, then frozen-VAE diffusion) is a
# follow-up enhancement; the joint-training setup here is simpler
# and stable in practice with the small KL weight.
#
# Mutually exclusive with EDM, kNN-graph, c2f, and hierarchical
# wrappers — LDM owns the whole prediction pathway (encoder →
# denoiser → decoder) and doesn't compose with output-head wrappers
# or teacher-forcing pre-processors. Construction asserts this.
# ---------------------------------------------------------------------------
latent_diffusion:
    # Latent dimensionality (per cell). 64-256 typical for image LDM;
    # for scgg per-cell latents a smaller k (32-128) is usually
    # enough since the target is 2-D positions, not high-D images.
    # k=128 default is a comfortable starting point.
    latent_dim: 128
    # VAE encoder/decoder hidden width + depth (small transformers).
    vae_hidden_dim: 256
    vae_n_layers: 4
    vae_n_heads: 4
    # Denoiser (DiT-style block stack operating in latent space).
    # Hidden width / depth / attention heads / FFN ratio / time-embed
    # dim mirror the standalone DiT backbone's defaults. Override
    # ``denoiser_n_layers`` to deepen the denoiser specifically;
    # defaults to ``cfg.model.n_layers`` when omitted (so the global
    # depth knob still works).
    denoiser_hidden_dim: 256
    denoiser_n_heads: 8
    denoiser_mlp_ratio: 4
    denoiser_time_embed_dim: 256
    # Diffusion trajectory: standard linear-FM in latent space.
    n_diffusion_steps: 50
    epsilon_t: 1.0e-3

# ---------------------------------------------------------------------------
# Self-conditioning for FM (Chen et al. 2023 trick).
#
# Under cfg.model (not cfg.train) because it bumps the inner
# backbone's ``input_dims["node_features_dimensions"]`` by 2 — i.e.
# the model's architecture differs depending on this flag's value,
# and the checkpoint format depends on it being consistent at train
# and inference time.
#
# At training with probability ``prob``: two-pass forward — first
# pass with zero self-cond, detach x_0_pred, then second pass
# conditions on it. At inference, each sampling step's prediction
# conditions the next step.
# ---------------------------------------------------------------------------
self_conditioning:
    enabled: false
    # Probability of doing the two-pass training step (vs single-pass
    # with zero self-cond). 0.5 is the canonical value.
    prob: 0.5
