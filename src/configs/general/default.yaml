name : 'MERFISH_mouse_cortex' # name of the experiment
wandb: 'online' # run, disabled, online, dryrun or offline
# wandb project name. Our wrapper scripts inject this (scgg / luna);
# kept as a declared field with a `null` default so Hydra's strict
# `compose()` accepts plain `general.wandb_project=...` overrides
# instead of demanding the `+general.wandb_project=...` add-prefix.
wandb_project: null
# wandb entity (team or user). null → wandb's default = your
# personal account. Pass `general.wandb_entity=<team>` if you want
# the runs to land under a team account instead.
wandb_entity: null
mode: 'train_and_test' # 'train_and_test', 'test_only', 'train_only'
seed: 0 # random seed
enable_progress_bar: True # Enable progress bar for training and validation
local_saved_path: null # path to save the experiment results. 'null' to save to the default path.
