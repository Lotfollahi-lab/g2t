# ScGG: Spatial Graph Generation
# Default configuration
#
# Primary objective is "contrastive" (PinSage-style supervised InfoNCE on a
# learned metric embedding, evaluated against the GT spatial kNN graph).
# Flow matching is retained as an ablation via training.objective: flow_matching.

# --- Model ---
model:
  # Gene expression encoder
  encoder:
    hidden_dims: [512, 256]
    embed_dim: 128
    dropout: 0.1
    norm: "layernorm"  # layernorm | batchnorm | none

  # Section-level encoder (DeepSets-style attention pooling)
  section_encoder:
    hidden_dim: 128
    embed_dim: 64
    n_attention_heads: 4
    subsample_size: 4096  # max cells to use for section embedding computation

  # Metric head (used when training.objective == "contrastive")
  # Two architectures, selected by `type`:
  #   * "cross_attention" (default, recommended): LUNA-style multi-head
  #       self-attention over all cells in a slice. Lets each cell's metric
  #       embedding depend on every other cell — essential for breaking
  #       ties between same-type cells in the same slice.
  #   * "mlp": per-cell MLP using (cell_embed, section_embed). Cheaper but
  #       fundamentally limited (no cell-to-cell info flow).
  metric_head:
    type: "cross_attention"   # mlp | cross_attention
    # Output dimension of the metric space. 32 is a compromise between the
    # original 64 (more capacity but spatial signal can hide in
    # lower-variance directions a linear readout drops) and 8 (forces
    # extreme compression but starves the CoordRegressionLoss head when
    # both cell-class structure and 2-D spatial axes need to coexist on
    # a unit sphere). 32 gives the coord head's Linear(32, 2) plenty of
    # room to find clean spatial axes while keeping the rest for class
    # structure.
    embed_dim: 32
    normalize: true           # L2-normalize so FAISS L2 == cosine ranking
    dropout: 0.1
    # cross_attention-specific
    n_layers: 2
    n_heads: 4
    ff_mult: 4
    use_section_embed: false  # attention already integrates slice context
    # mlp-specific (ignored for cross_attention)
    hidden_dims: [256, 128]

  # Velocity / coord-predictor network (built when objective == "flow_matching")
  #
  # Three flavours:
  #   "mlp" (legacy): per-cell MLP velocity. No cell-cell context.
  #       Kept for ablations only.
  #   "cross_attention": single-stream transformer with multi-head
  #       self-attention over cells of the slice. Predicts velocity.
  #       Faster + simpler than the LUNA variant.
  #   "luna" (default, recommended): faithful port of LUNA's
  #       architecture — three input streams (node features, diffusion
  #       time, positions) processed by separate MLPs, jointly updated
  #       by N transformer layers with position-direction conditioning,
  #       and an output stage that produces x_0 by modulating the
  #       running position's magnitude via a feature-conditioned MLP.
  #       Predicts x_0 directly (not velocity); the pairwise-distance
  #       loss in ConditionalFlowMatching consumes it.
  velocity_net:
    type: "luna"                # mlp | cross_attention | luna
    # --- "mlp" specific ----------------------------------------------
    hidden_dims: [512, 512, 256]
    # --- "cross_attention" specific ----------------------------------
    hidden_dim: 256             # transformer width  (LUNA default: 256)
    # --- "luna" specific ---------------------------------------------
    # LUNA's `hidden_dims` dict translates to:
    #   dx   -> node_dim          (node feature stream width)
    #   dy   -> time_dim_hidden   (time stream width)
    #   dd   -> delta_dim         (position-direction embedding)
    # n_heads must divide node_dim. 256 / 8 = 32 head_dim — same as
    # LUNA's `num_heads=16, dx=256` would give a smaller head_dim, but
    # 8 heads with head_dim=32 is plenty.
    node_dim: 256
    time_dim_hidden: 128
    delta_dim: 64
    # --- common (all flavours) ---------------------------------------
    n_layers: 8                 # transformer depth  (LUNA default: 8)
    n_heads: 8                  # MHA heads
    ff_mult: 4                  # FFN expansion factor
    time_embed_dim: 64
    k_embed_dim: 16
    dropout: 0.1

  # Spatial dim for the flow-matching ablation (target is GT 2D coords)
  spatial_dim: 2

  # Flow matching (only used when objective == "flow_matching")
  flow:
    sigma_min: 1.0e-4
    solver: "euler"     # euler | midpoint | rk4
    n_steps: 100
    # LUNA-aligned loss configuration. Two loss terms run jointly:
    #   * pairwise_dist_weight: MSE on the cdist matrix of the implied
    #     x_0 estimate vs GT (LUNA's `metrics.loss_function.LossFunction`).
    #     Rotation/translation/reflection invariant — directly
    #     optimises the structural property the Spearman headline
    #     measures. This is the primary training signal.
    #   * velocity_mse_weight: standard OT-CFM velocity MSE. Kept as a
    #     small regulariser; setting to 0 disables it entirely.
    # With the prior (velocity-only) setup the Spearman collapsed to
    # ~0 because the velocity target u_t = z_1 - (1-σ_min)·z_0 varies
    # with the random noise direction z_0, so MSE on velocity sees a
    # very noisy target. The pairwise-distance loss is computed on
    # x_hat_0 := z_t + (1-t)·v_t — which is invariant to z_0.
    pairwise_dist_weight: 1.0
    velocity_mse_weight: 0.1
    # Subtract the per-batch mean of the velocity prediction so the
    # network can't waste capacity learning the slice centroid (LUNA
    # does this via remove_mean_with_mask). With centred targets, this
    # is a pure constraint, no information lost.
    translation_equivariant: true
    # cdist over all N cells is O(N^2) memory; subsample when N is
    # larger than this. Cortex slices are ~5-7k so the default 4k is
    # a no-op for most slices and a soft cap for the largest.
    pairwise_dist_max_cells: 4096
    # What the underlying network is parameterised to predict.
    # Set automatically based on `model.velocity_net.type`:
    #   * "luna"             -> "x_0"
    #   * "cross_attention"  -> "velocity"
    #   * "mlp"              -> "velocity"
    # Override here to force a different mode (e.g. train the cross-
    # attention net with x_0 prediction instead of velocity).
    # prediction_target: x_0

# --- Graph ---
graph:
  k_default: 10            # default kNN parameter (the user's k=10)
  # k_train_range pinned to [k_default, k_default] so every step uses the
  # same k value the model is evaluated at. The previous wide range
  # [5, 30] meant only ~1/26 of training steps saw k=10, diluting the
  # per-k conditioning signal. Widen again only when you specifically
  # want to train a k-conditional flow.
  k_train_range: [10, 10]
  k_train_probs: null      # uniform if null
  backend: "faiss"         # faiss | sklearn
  metric: "euclidean"

# --- Data ---
data:
  dataset: "merfish"
  data_dir: "./data/merfish"
  gene_list: null
  n_top_hvg: null
  # LUNA-compatible defaults: pass gene-expression values through as-is.
  # The silver h5ad (built from LUNA's CSVs) carries non-integer
  # per-cell-normalized counts in [0, ~250]; LUNA's model is trained on
  # exactly these values with no further transformation. Our prior
  # default (normalize_total(1e4) + log1p + scale) turned the input
  # into z-scored [-10, 10] values — a completely different distribution
  # than what the architecture (cross-attention transformer) and the
  # newly aligned pairwise-distance loss expect. The audit against
  # LUNA's pipeline (datasets/data_module.py + utils/data/load.py)
  # confirmed log2_norm is defined but NEVER called in their pipeline.
  normalize: false
  scale: false
  min_cells_per_section: 100
  # LUNA's `position_normalize` does per-section, per-axis min-max to
  # [-0.5, 0.5] (each axis scaled independently). This matches our new
  # `per_section_minmax` mode. The legacy `per_section` (zero-mean
  # unit-std with a SCALAR std) was the prior default and preserves the
  # slice's aspect ratio but produces values outside the [-0.5, 0.5]
  # box LUNA's model is trained against.
  coord_normalize: "per_section_minmax"
  # Random per-section rotation each epoch. Useful for invariance, but
  # disabled while we diagnose flow-matching collapse: with rotation on,
  # the only learnable structure is *pairwise* (the absolute coord-from-
  # gene_expr signal is randomized away), which doubles the work the
  # cross-attention has to do. Turn back on once the encoder produces
  # discriminative embeddings (cell_class_aux + contrastive_spatial
  # take care of that).
  coord_augment_rotation: false
  coord_center: true

# --- Training ---
training:
  # ===== Objective =====
  # "flow_matching" (default): LUNA-style conditional flow matching. The
  #     velocity network is trained to denoise Gaussian samples into 2-D
  #     spatial coordinates conditioned on gene expression + section
  #     context. At inference an ODE solver generates 2-D coords directly,
  #     so there's no embed-then-project step that can hide spatial signal
  #     in low-variance directions.
  #     Caveat: our VelocityNetwork is a per-cell MLP (cell-cell info
  #     enters only through the scalar section_embed). LUNA's DiT has
  #     cross-attention between cells during denoising — if our results
  #     plateau short of LUNA-quality, upgrading VelocityNetwork to
  #     cross-attention is the natural next step.
  # "contrastive" (ablation): SupCon on the metric embedding + optional
  #     pairwise-distance Pearson + Procrustes-aligned coord head. The
  #     visualization quality is bounded by what a 2-D linear readout of
  #     the embedding can recover; in practice the tangential axis
  #     collapsed even after the coord head was added.
  objective: "flow_matching"

  seed: 42
  epochs: 200
  batch_size: 8192
  sections_per_epoch: null
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 10
  grad_clip: 1.0

  # ===== Loss configuration =====
  # Two complementary losses run together by default in contrastive mode:
  #
  #   contrastive (SupCon) — top-k retrieval; sharpens the kNN that becomes
  #       the final output. Drives contact precision/F1.
  #
  #   distance_regression — pairwise-distance Pearson correlation (LUNA-style).
  #       Directly optimizes the structural target the Spearman eval metric
  #       measures. Without this, the model only cares about top-k and gets
  #       penalized on the full pairwise-distance Spearman.
  #
  # Both are enabled by default with weight=1.0. If you want to ablate one,
  # set its weight to 0 or its `enabled: false` flag.
  loss:
    contrastive:
      weight: 1.0
      temperature: 0.07           # SupCon / SimCLR convention
      max_positives_per_anchor: null   # null = use all in-batch positives
      exclude_self: true

    distance_regression:
      enabled: true
      # Weight bumped from 1.0 to 2.0 to make the 2-D-coord pairwise
      # structure loss matter relative to the SupCon contrastive term
      # (which has weight 1.0). Together with coord_regression weight 5.0,
      # the model now treats 2-D coord fidelity as the dominant training
      # signal — exactly where we want it for LUNA-quality visuals.
      weight: 2.0
      use_squared: true           # squared Euclidean distances (smoother grads)
      # Which tensor to compute pairwise distance Pearson on:
      #   'coord_head' (default when coord_regression.enabled is true):
      #       operate on the 2-D output of the CoordRegressionLoss head.
      #       Couples this loss directly to what gets visualized and stops
      #       a single dominant embedding axis (depth in cortex) from
      #       being a sufficient solution. *Both* output axes must be
      #       right for the Pearson to be high.
      #   'embedding' (legacy):
      #       operate on the raw metric embedding (B, embed_dim). Closer
      #       to the original LUNA-eq-11 formulation but lets the model
      #       hide spatial signal in low-variance dimensions a linear
      #       2-D readout can't see.
      target: "coord_head"
      # When false (default), Pearson is computed on all in-batch pairs.
      # When true, Pearson is computed *per cell class* and averaged across
      # classes — between-class pairs no longer contribute. Use this when
      # the inference UMAP diagnostic shows the embedding has collapsed to
      # a cell-type classifier (i.e. global Spearman is decent but the
      # mean of per-class median Spearmans is near zero). Requires the
      # batch to carry `cell_class` (set automatically by the LUNA cortex
      # and ABC loaders).
      class_stratified: false
      min_cells_per_class: 6      # min cells of a class in a batch to include it

    # Direct 2-D coordinate regression with a learned Linear(metric_dim, 2)
    # head and Procrustes-aligned MSE. Forces *both* spatial axes to be
    # encoded as linear directions of the metric embedding — the
    # pairwise-distance Pearson loss is dominated by the high-variance
    # axis (depth in cortex) and can be satisfied while leaving the
    # tangential axis essentially unconstrained. The Kabsch alignment
    # is stop-grad'd so the model has to produce intrinsically
    # well-shaped coords, not predictions that game the transform.
    # On by default; disable for ablations.
    coord_regression:
      enabled: true
      # Weight bumped from 1.0 to 5.0 so the coord MSE dominates the total
      # loss. Empirically the contrastive term sits around 6-7 while
      # coord_loss sits around 0.3-1.0, so without a large multiplier the
      # coord head barely shifts the encoder. With weight=5.0 it
      # contributes 1.5-5.0 to the total — comparable to contrastive,
      # which is what we want for 2-D coord fidelity to be the primary
      # training signal.
      weight: 5.0
      # If false (default), the alignment is rotation-only (det(R) = +1)
      # so the model can't satisfy the loss by mirroring its output.
      # True allows reflection — useful only for datasets without a
      # definite handedness.
      allow_reflection: false
      # Divide MSE by mean GT coord variance so the loss is in [0, ~1]
      # and comparable across slices with different physical scales.
      normalize_by_var: true

    # Auxiliary classifier on the encoder cell_embed against the GT
    # cell-class labels. Adds orthogonal supervision: same-class cells tend
    # to co-localize spatially (cortical layers etc.), so a class-aware
    # encoder is a useful inductive bias for spatial-graph prediction.
    #
    # ON by default for flow_matching because the velocity-MSE gradient is
    # a notoriously dilute signal for the encoder (it has to back-prop
    # through 8 transformer layers from a noisy per-cell MSE). Without
    # this, the encoder tends to produce near-identical embeddings for
    # all cells in a slice, the cross-attention has nothing to distinguish
    # them, and the model collapses to Spearman ~ 0. With this enabled
    # the encoder gets a direct classification gradient.
    # The luna_cortex loader auto-wires `n_classes` from `cell_class`
    # in obs; the head is silently skipped if no labels are available.
    cell_class_aux:
      enabled: true
      weight: 0.5
      hidden_dim: 128
      dropout: 0.1

    # Settings for the flow-matching objective. Only used when
    # objective == "flow_matching"; ignored in contrastive mode.
    flow_matching: 1.0           # weight of the FM (velocity MSE) term
    # Auxiliary InfoNCE on the encoder cell embeddings, using the GT
    # spatial kNN graph as positives. LUNA doesn't need this because
    # their adaLN-style conditioning gives the encoder a strong gradient
    # at every transformer layer; our concat-only conditioning passes
    # encoder gradient through a single Linear projection, so the
    # encoder needs an additional direct supervision signal to learn
    # discriminative per-cell embeddings. Without this, all cells in a
    # slice get near-identical embeddings and the cross-attention
    # velocity net collapses.
    contrastive_spatial: 0.1
    contrastive_temperature: 0.1
    contrastive_n_negatives: 64

  # ===== Optional OOD / cross-modality components =====
  # All disabled by default. Quantify the bare ST->scRNA gap first; flip
  # these on later. None of them rely on PASTE-style cell pairing — they
  # only assume section-level pairing between adjacent ST and scRNA sections.
  ood:
    cross_modality_contrastive:
      enabled: false
      weight: 0.1
      temperature: 0.1
      normalize_inputs: false
      symmetric: true
    section_embedding_consistency:
      enabled: false
      weight: 1.0
      distance: "l2"        # l2 | cosine
      normalize: false
    domain_adversarial:
      enabled: false
      weight: 0.1
      n_domains: 2
      hidden_dim: 128
      lambd: 1.0            # gradient-reversal strength

  # ===== Checkpointing & logging =====
  checkpoint_dir: "./checkpoints"
  save_every: 10
  log_every: 100
  eval_every: 5

  # Weights & Biases
  wandb: true
  wandb_project: "scgg"
  wandb_run_name: null
  wandb_tags: []

# --- Evaluation ---
evaluation:
  k_values: [5, 10, 15, 20]
  n_samples: 5
  metrics:
    - edge_f1
    - neighborhood_composition
    - spatial_autocorrelation
    - degree_distribution
  n_eval_sections: 5
