# ScGG: Spatial Graph Generation via Conditional Flow Matching
# Default configuration

# --- Model ---
model:
  # Gene expression encoder
  encoder:
    hidden_dims: [512, 256]
    embed_dim: 128
    dropout: 0.1
    norm: "layernorm"  # layernorm | batchnorm | none

  # Section-level encoder (DeepSets-style attention pooling)
  section_encoder:
    hidden_dim: 128
    embed_dim: 64
    n_attention_heads: 4
    subsample_size: 4096  # max cells to use for section embedding computation

  # Velocity network
  velocity_net:
    hidden_dims: [512, 512, 256]
    time_embed_dim: 64
    k_embed_dim: 16
    dropout: 0.1

  # Spatial embedding dimension (output of flow)
  spatial_dim: 2  # 2D coordinates; set to higher for learned embeddings

  # Flow matching
  flow:
    sigma_min: 1.0e-4  # minimum noise for OT paths
    solver: "euler"     # euler | midpoint | rk4
    n_steps: 100        # ODE integration steps at inference

# --- Graph ---
graph:
  k_default: 10            # default kNN parameter
  k_train_range: [5, 30]   # range of k values seen during training
  k_train_probs: null       # if null, sample uniformly
  backend: "faiss"          # faiss | sklearn
  metric: "euclidean"

# --- Data ---
data:
  dataset: "merfish"
  data_dir: "./data/merfish"
  gene_list: null           # if null, use all shared genes
  n_top_hvg: null           # if set, select top N highly variable genes
  normalize: true           # log1p normalization
  scale: true               # z-score per gene
  min_cells_per_section: 100
  coord_normalize: "per_section"  # per_section | global | none
  coord_augment_rotation: true
  coord_center: true

# --- Training ---
training:
  seed: 42
  epochs: 200
  batch_size: 8192          # cells per batch
  sections_per_epoch: null  # null = all sections
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 10
  grad_clip: 1.0

  # Loss weights
  loss:
    flow_matching: 1.0
    contrastive_spatial: 0.1   # weight for contrastive graph loss
    contrastive_temperature: 0.1
    contrastive_n_negatives: 64

  # Checkpointing
  checkpoint_dir: "./checkpoints"
  save_every: 10

  # Logging
  log_every: 100        # steps
  eval_every: 5         # epochs

  # Weights & Biases
  wandb: true
  wandb_project: "scgg"
  wandb_run_name: null   # null = auto-generated by wandb
  wandb_tags: []         # e.g. ["merfish", "mouse_brain", "debug"]

# --- Evaluation ---
evaluation:
  k_values: [5, 10, 15, 20]
  n_samples: 5             # number of flow samples for uncertainty
  metrics:
    - edge_f1
    - neighborhood_composition
    - spatial_autocorrelation
    - degree_distribution
  n_eval_sections: 5       # sections to evaluate on
